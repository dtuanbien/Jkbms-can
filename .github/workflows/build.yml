name: Build ESPHome Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ESPHome and Build
        run: |
          pip install esphome
          esphome compile jkbms.yaml
      - uses: actions/upload-artifact@v6
        with:
          name: firmware-bin
          path: .esphome/build/*/.pioenvs/*/firmware.factory.bin
