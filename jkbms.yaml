substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"
  mqtt_broker: "broker.emqx.io" # Dùng sẵn broker công cộng miễn phí (hoặc đổi sang IP nội bộ của bạn)

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"
  ap:
    ssid: "JKBMS-Fallback"
    password: "12345678"

# 1. Giao diện Web xem trực tiếp không cần mạng Internet
web_server:
  port: 80
  version: 1

# 2. Kết nối MQTT xem trên App điện thoại
mqtt:
  broker: ${mqtt_broker}
  port: 1883
  topic_prefix: jkbms_tuanbien_9988 # Đổi số đuôi này thành số bí mật của riêng bạn để tránh trùng người khác

ota:
  platform: esphome

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main
  - source: github://syssi/esphome-jk-bms-can@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 2s
    id: bms0

canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

jk_bms_can:
  - jk_bms_ble_id: bms0
    canbus_id: can_bus
    protocol: PYLON
    update_interval: 1s
    charge_voltage: 28.4V
    charge_current_limit: 70A
    discharge_current_limit: 75A
    discharge_voltage: 25.0V

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      name: "Tong dien ap"
      id: total_voltage
    current:
      name: "Dong sac xa"
      id: current
    power:
      name: "Cong suat"
    state_of_charge:
      name: "Phan tram pin"
      id: state_of_charge
    power_tube_temperature:
      name: "Nhiet do MOS"
      id: mos_temp
    temperature_sensor_1:
      name: "Nhiet do pin 1"
      id: temp_1
    min_cell_voltage:
      name: "Cell thap nhat"
      id: min_cell_voltage
    max_cell_voltage:
      name: "Cell cao nhat"
      id: max_cell_voltage
    delta_cell_voltage:
      name: "Do lech cell"
    cell_voltage_1:
      name: "Cell 1"
    cell_voltage_2:
      name: "Cell 2"
    cell_voltage_3:
      name: "Cell 3"
    cell_voltage_4:
      name: "Cell 4"
    cell_voltage_5:
      name: "Cell 5"
    cell_voltage_6:
      name: "Cell 6"
    cell_voltage_7:
      name: "Cell 7"
    cell_voltage_8:
      name: "Cell 8"
