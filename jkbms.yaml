substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"
  blynk_token: "YApwHwb_atq5PAiQzC-0qHsb74EPLW6e"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  networks:
    - ssid: "TUAN BIEN"
      password: "76767676"
      priority: 10
      manual_ip:
        static_ip: 192.168.10.200
        gateway: 192.168.10.1
        subnet: 255.255.255.0
    - ssid: "VUNGO"
      password: "1234567890"
      priority: 5
    - ssid: "Quang Tho"
      password: "12345678"
      priority: 3
  ap:
    ssid: "JKBMS-Senergy-Backup"
    password: "12345678"

# Web Server bản nhẹ (tiết kiệm tối đa RAM cho Bluetooth và CAN)
web_server:
  port: 80
  version: 2

ota:
  platform: esphome

http_request:
  useragent: esphome/device
  timeout: 5s

interval:
  - interval: 10s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                url: !lambda |-
                  float v0 = isnan(id(total_voltage).state) ? 0.0 : id(total_voltage).state;
                  float v1 = isnan(id(current).state) ? 0.0 : id(current).state;
                  int v2 = isnan(id(state_of_charge).state) ? 0 : (int)id(state_of_charge).state;
                  return std::string("http://blynk.cloud{blynk_token}&V0=") +
                         std::to_string(v0) + "&V1=" + std::to_string(v1) + "&V2=" + std::to_string(v2);

  - interval: 1s
    then:
      - lambda: |-
          std::vector<uint8_t> d351 = {0x1C, 0x01, 0xBC, 0x02, 0xEE, 0x02, 0xFA, 0x00}; // 28.4V, 70A sac, 75A xa, 25.0V ngat
          id(can_bus).send_data(0x351, false, d351);

          uint16_t soc = isnan(id(state_of_charge).state) ? 50 : (uint16_t)id(state_of_charge).state;
          std::vector<uint8_t> d355 = {(uint8_t)(soc & 0xFF), (uint8_t)(soc >> 8), 100, 0, 0, 0, 0, 0};
          id(can_bus).send_data(0x355, false, d355);

          int16_t v_real = isnan(id(total_voltage).state) ? 2600 : (int16_t)(id(total_voltage).state * 100);
          int16_t i_real = isnan(id(current).state) ? 0 : (int16_t)(id(current).state * 10);
          int16_t t_real = isnan(id(mos_temp).state) ? 250 : (int16_t)(id(mos_temp).state * 10);
          std::vector<uint8_t> d356 = {
            (uint8_t)(v_real & 0xFF), (uint8_t)(v_real >> 8),
            (uint8_t)(i_real & 0xFF), (uint8_t)(i_real >> 8),
            (uint8_t)(t_real & 0xFF), (uint8_t)(t_real >> 8), 0, 0
          };
          id(can_bus).send_data(0x356, false, d356);

          std::vector<uint8_t> d359 = {0x00, 0x00, 0x00, 0x00, 0x01, 0x50, 0x4E, 0x00};
          std::vector<uint8_t> d35c = {0xC0, 0x00};
          std::vector<uint8_t> d35e = {'P', 'Y', 'L', 'O', 'N', ' ', ' ', ' '};
          id(can_bus).send_data(0x359, false, d359);
          id(can_bus).send_data(0x35C, false, d35c);
          id(can_bus).send_data(0x35E, false, d35e);

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 2s
    id: bms0

canbus:
  - platform: esp32_can
    id: can_bus
    can_id: 0x351
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      name: "Dien ap Pin (V)"
      id: total_voltage
    current:
      name: "Dong Pin (A)"
      id: current
    state_of_charge:
      name: "Dung luong Pin (%)"
      id: state_of_charge
    power_tube_temperature:
      name: "Nhiet do MOS (C)"
      id: mos_temp
