substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"

esphome:
  name: ${name}
  friendly_name: JK BMS Senergy 4kW

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"

web_server:
  port: 80

ota:
  platform: esphome

# ==========================================
# 1. KẾT NỐI BLUETOOTH VỚI JK BMS
# ==========================================
esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main
  - source: github://syssi/esphome-jk-bms-can@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 2s
    id: bms0

# ==========================================
# 2. XUẤT GIAO TIẾP CAN PYLONTECH SANG SENERGY
# ==========================================
canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

jk_bms_can:
  - jk_bms_ble_id: bms0
    canbus_id: can_bus
    protocol: PYLON
    update_interval: 1s
    charge_voltage: 28.4V
    charge_current_limit: 70A
    discharge_current_limit: 75A
    discharge_voltage: 25.0V

# ==========================================
# 3. GIAO TIẾP MODBUS RS485 VỚI BIẾN TẦN SENERGY
# ==========================================
uart:
  - id: modbus_uart
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600

modbus:
  id: modbus1
  uart_id: modbus_uart

modbus_controller:
  - id: senergy_inverter
    address: 0x01
    modbus_id: modbus1
    update_interval: 5s

# ==========================================
# 4. CẢM BIẾN ĐỌC TỪ JK BMS & SENERGY
# ==========================================
sensor:
  # --- Thông số Pin JK BMS ---
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      name: "Pin - Total Voltage"
      id: total_voltage
    current:
      name: "Pin - Current"
      id: current
    power:
      name: "Pin - Power"
      id: power
    state_of_charge:
      name: "Pin - State of Charge"
      id: state_of_charge
    capacity_remaining:
      name: "Pin - Capacity Remaining"
      id: capacity_remaining
    total_battery_capacity_setting:
      name: "Pin - Total Capacity"
      id: total_battery_capacity
    charging_cycles:
      name: "Pin - Charging Cycles"
      id: charging_cycles
    power_tube_temperature:
      name: "Pin - MOS Temperature"
      id: mos_temp
    temperature_sensor_1:
      name: "Pin - Temperature 1"
      id: temp_1
    temperature_sensor_2:
      name: "Pin - Temperature 2"
      id: temp_2
    min_cell_voltage:
      name: "Pin - Min Cell Voltage"
      id: min_cell_voltage
    max_cell_voltage:
      name: "Pin - Max Cell Voltage"
      id: max_cell_voltage
    delta_cell_voltage:
      name: "Pin - Delta Cell Voltage"
      id: delta_cell_voltage
    cell_voltage_1:
      name: "Pin - Cell 1"
    cell_voltage_2:
      name: "Pin - Cell 2"
    cell_voltage_3:
      name: "Pin - Cell 3"
    cell_voltage_4:
      name: "Pin - Cell 4"
    cell_voltage_5:
      name: "Pin - Cell 5"
    cell_voltage_6:
      name: "Pin - Cell 6"
    cell_voltage_7:
      name: "Pin - Cell 7"
    cell_voltage_8:
      name: "Pin - Cell 8"

  # --- Thông số Biến tần Senergy (Modbus) ---
  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - Cong Suat Luoi (W)"
    register_type: read
    address: 0x1005
    value_type: S_WORD
    unit_of_measurement: "W"

  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - Cong Suat PV1 (W)"
    register_type: read
    address: 0x1001
    value_type: U_WORD
    unit_of_measurement: "W"

  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - Cong Suat PV2 (W)"
    register_type: read
    address: 0x1002
    value_type: U_WORD
    unit_of_measurement: "W"

  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - Cong Suat Tai (W)"
    register_type: read
    address: 0x1006
    value_type: U_WORD
    unit_of_measurement: "W"

  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - Dien Ap Luoi (V)"
    register_type: read
    address: 0x1000
    value_type: U_WORD
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"

# ==========================================
# 5. ĐIỀU KHIỂN SENERGY & CÔNG TẮC BMS
# ==========================================
switch:
  # Công tắc Cho Phép Đẩy Lưới trên Senergy
  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - Cho Phep Day Luoi"
    register_type: holding
    address: 0x1010
    bitmask: 1

  # Công tắc điều khiển trên JK BMS
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    charging:
      name: "Pin - Charging Switch"
    discharging:
      name: "Pin - Discharging Switch"
    balancer:
      name: "Pin - Balancer Switch"

select:
  # Chế độ chỉ đẩy lưới PV (Không dùng pin đẩy lưới)
  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - Che Do Day Luoi"
    id: senergy_export_mode
    register_type: holding
    address: 0x1011
    value_type: U_WORD
    optionsmap:
      "Bam Tai (Zero Export)": 0
      "Chi Day Luoi PV (PV Export Only)": 1

number:
  # Cài đặt công suất đẩy lưới PV (0W - 4000W)
  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - Cong Suat Day Luoi PV (W)"
    id: senergy_pv_export_limit
    register_type: holding
    address: 0x1013
    value_type: U_WORD
    min_value: 0
    max_value: 4000
    step: 100
    unit_of_measurement: "W"

  # Giới hạn dòng sạc trên Senergy (0A - 120A)
  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - Gioi Han Dong Sac (A)"
    register_type: holding
    address: 0x1014
    value_type: U_WORD
    min_value: 0
    max_value: 120
    step: 5
    unit_of_measurement: "A"

  # SOC cắt xả tối thiểu (%)
  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - SOC Cat Xa Toi Thieu (%)"
    register_type: holding
    address: 0x1015
    value_type: U_WORD
    min_value: 5
    max_value: 90
    step: 5
    unit_of_measurement: "%"
