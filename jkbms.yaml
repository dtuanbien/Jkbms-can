substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"
  ap:
    ssid: "JKBMS-Setup-Wifi"
    password: "12345678"

captive_portal:

web_server:
  port: 80

ota:
  platform: esphome

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 2s
    id: bms0

canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO21
    rx_pin: GPIO22
    can_id: 0x351
    bit_rate: 500kbps

number:
  - platform: template
    name: "1. Dien ap sac day (V)"
    id: set_charge_v
    min_value: 26.0
    max_value: 29.2
    step: 0.1
    initial_value: 28.4
    optimistic: true
    restore_value: true

  - platform: template
    name: "2. Dien ap ngat xa (V)"
    id: set_discharge_v
    min_value: 22.0
    max_value: 26.5
    step: 0.1
    initial_value: 25.0
    optimistic: true
    restore_value: true

  - platform: template
    name: "3. Dong sac toi da (A)"
    id: set_charge_i
    min_value: 10
    max_value: 100
    step: 5
    initial_value: 70
    optimistic: true
    restore_value: true

  - platform: template
    name: "4. Dong xa toi da (A)"
    id: set_discharge_i
    min_value: 10
    max_value: 100
    step: 5
    initial_value: 75
    optimistic: true
    restore_value: true

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      name: "Battery Voltage"
      id: total_voltage
    current:
      name: "Battery Current"
      id: current
    state_of_charge:
      name: "Battery SoC"
      id: state_of_charge
    power_tube_temperature:
      name: "MOS Temperature"
      id: mos_temp
    temperature_sensor_1:
      name: "Battery Temp 1"
      id: temp_1

interval:
  - interval: 1s
    then:
      - lambda: |-
          uint16_t max_chg_v = (uint16_t)(id(set_charge_v).state * 10);
          int16_t max_chg_i = (int16_t)(id(set_charge_i).state * 10);
          int16_t max_dis_i = (int16_t)(id(set_discharge_i).state * 10);
          uint16_t min_dis_v = (uint16_t)(id(set_discharge_v).state * 10);
          std::vector<uint8_t> d351 = {
            (uint8_t)(max_chg_v & 0xFF), (uint8_t)(max_chg_v >> 8),
            (uint8_t)(max_chg_i & 0xFF), (uint8_t)(max_chg_i >> 8),
            (uint8_t)(max_dis_i & 0xFF), (uint8_t)(max_dis_i >> 8),
            (uint8_t)(min_dis_v & 0xFF), (uint8_t)(min_dis_v >> 8)
          };
          id(can_bus).send_data(0x351, false, d351);

          uint16_t soc = isnan(id(state_of_charge).state) ? 50 : (uint16_t)id(state_of_charge).state;
          uint16_t soh = 100;
          std::vector<uint8_t> d355 = {
            (uint8_t)(soc & 0xFF), (uint8_t)(soc >> 8),
            (uint8_t)(soh & 0xFF), (uint8_t)(soh >> 8),
            0x00, 0x00, 0x00, 0x00
          };
          id(can_bus).send_data(0x355, false, d355);

          int16_t volt = isnan(id(total_voltage).state) ? 2640 : (int16_t)(id(total_voltage).state * 100);
          int16_t curr = isnan(id(current).state) ? 0 : (int16_t)(id(current).state * 10);
          int16_t temp = isnan(id(temp_1).state) ? 250 : (int16_t)(id(temp_1).state * 10);
          std::vector<uint8_t> d356 = {
            (uint8_t)(volt & 0xFF), (uint8_t)(volt >> 8),
            (uint8_t)(curr & 0xFF), (uint8_t)(curr >> 8),
            (uint8_t)(temp & 0xFF), (uint8_t)(temp >> 8),
            0x00, 0x00
          };
          id(can_bus).send_data(0x356, false, d356);

          std::vector<uint8_t> d359 = {0x00, 0x00, 0x00, 0x00, 0x01, 0x50, 0x4E, 0x00};
          id(can_bus).send_data(0x359, false, d359);
          std::vector<uint8_t> d35c = {0xC0, 0x00};
          id(can_bus).send_data(0x35C, false, d35c);

          std::vector<uint8_t> d35e = {'P', 'Y', 'L', 'O', 'N', ' ', ' ', ' '};
          id(can_bus).send_data(0x35E, false, d35e);
