substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"
  blynk_token: "YApwHwb_atq5PAiQzC-0qHsb74EPLW6e"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

# Kết nối Wi-Fi chính + 2 Wi-Fi dự phòng (Tự động chuyển đổi khi rớt mạng)
wifi:
  networks:
    - ssid: "TUAN BIEN"
      password: "76767676"
      priority: 10
      manual_ip:
        static_ip: 192.168.10.200
        gateway: 192.168.10.1
        subnet: 255.255.255.0

    - ssid: "VUNGO"
      password: "1234567890"
      priority: 5

    - ssid: "Quang Tho"
      password: "12345678"
      priority: 3

  ap:
    ssid: "JKBMS-Senergy-Backup"
    password: "12345678"

# Đồng bộ giờ chuẩn Việt Nam để chạy 4 khung giờ xả tùy chọn
time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Ho_Chi_Minh
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lambda: |-
              auto now = id(sntp_time).now();
              if (!now.is_valid()) return;
              int cur_mins = now.hour * 60 + now.minute;
              
              auto in_range = [&](int sh, int sm, int eh, int em) {
                int start = sh * 60 + sm;
                int end = eh * 60 + em;
                if (start <= end) return (cur_mins >= start && cur_mins < end);
                else return (cur_mins >= start || cur_mins < end);
              };

              bool active = false;
              if (id(slot1_enable).state && in_range(id(s1_start_h).state, id(s1_start_m).state, id(s1_end_h).state, id(s1_end_m).state)) active = true;
              if (id(slot2_enable).state && in_range(id(s2_start_h).state, id(s2_start_m).state, id(s2_end_h).state, id(s2_end_m).state)) active = true;
              if (id(slot3_enable).state && in_range(id(s3_start_h).state, id(s3_start_m).state, id(s3_end_h).state, id(s3_end_m).state)) active = true;
              if (id(slot4_enable).state && in_range(id(s4_start_h).state, id(s4_start_m).state, id(s4_end_h).state, id(s4_end_m).state)) active = true;

              if (id(discharge_master).state != active) {
                if (active) id(discharge_master).turn_on();
                else id(discharge_master).turn_off();
              }

# Web nội bộ (Giao diện Sáng/Tối Day-Night, biểu tượng Mặt trời & Nạp OTA)
web_server:
  port: 80
  version: 3
  local: true

ota:
  platform: esphome

# Gửi dữ liệu lên Blynk Cloud xem qua 4G (mỗi 10 giây)
http_request:
  useragent: esphome/device
  timeout: 5s

interval:
  - interval: 10s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                url: !lambda |-
                  char buf;
                  snprintf(buf, sizeof(buf),
                    "http://blynk.cloud",
                    "${blynk_token}",
                    isnan(id(total_voltage).state) ? 0.0 : id(total_voltage).state,
                    isnan(id(current).state) ? 0.0 : id(current).state,
                    isnan(id(state_of_charge).state) ? 0.0 : id(state_of_charge).state,
                    isnan(id(pv_power).state) ? 0.0 : id(pv_power).state,
                    isnan(id(grid_power).state) ? 0.0 : id(grid_power).state,
                    isnan(id(load_power).state) ? 0.0 : id(load_power).state,
                    isnan(id(bat_power).state) ? 0.0 : id(bat_power).state,
                    id(discharge_master).state ? 1 : 0
                  );
                  return std::string(buf);

  # Module 2: Gửi gói tin CAN chuẩn Pylontech trực tiếp sang Senergy 4kW mỗi 1 giây
  - interval: 1s
    then:
      - lambda: |-
          // 1. Gói 0x351: Giới hạn Áp sạc, Dòng sạc, Dòng xả (theo thanh cài đặt & lịch xả), Áp ngắt xả
          uint16_t chg_v = 284; // 28.4V (đơn vị 0.1V)
          uint16_t chg_i = (uint16_t)(id(set_charge_current).state * 10);
          uint16_t dis_i = id(discharge_master).state ? (uint16_t)(id(set_discharge_current).state * 10) : 0;
          uint16_t dis_v = (uint16_t)(id(set_cutoff_volt).state * 10);
          std::vector<uint8_t> d351 = {
            (uint8_t)(chg_v & 0xFF), (uint8_t)(chg_v >> 8),
            (uint8_t)(chg_i & 0xFF), (uint8_t)(chg_i >> 8),
            (uint8_t)(dis_i & 0xFF), (uint8_t)(dis_i >> 8),
            (uint8_t)(dis_v & 0xFF), (uint8_t)(dis_v >> 8)
          };
          id(can_bus).send_data(0x351, false, d351);

          // 2. Gói 0x355: Phần trăm Pin (SoC) và Sức khỏe Pin (SoH = 100%)
          uint16_t soc = isnan(id(state_of_charge).state) ? 50 : (uint16_t)id(state_of_charge).state;
          uint16_t soh = 100;
          std::vector<uint8_t> d355 = {
            (uint8_t)(soc & 0xFF), (uint8_t)(soc >> 8),
            (uint8_t)(soh & 0xFF), (uint8_t)(soh >> 8),
            0x00, 0x00, 0x00, 0x00
          };
          id(can_bus).send_data(0x355, false, d355);

          // 3. Gói 0x356: Điện áp thực (0.01V), Dòng điện thực (0.1A), Nhiệt độ (0.1C)
          int16_t v_real = isnan(id(total_voltage).state) ? 2600 : (int16_t)(id(total_voltage).state * 100);
          int16_t i_real = isnan(id(current).state) ? 0 : (int16_t)(id(current).state * 10);
          int16_t t_real = isnan(id(mos_temp).state) ? 250 : (int16_t)(id(mos_temp).state * 10);
          std::vector<uint8_t> d356 = {
            (uint8_t)(v_real & 0xFF), (uint8_t)(v_real >> 8),
            (uint8_t)(i_real & 0xFF), (uint8_t)(i_real >> 8),
            (uint8_t)(t_real & 0xFF), (uint8_t)(t_real >> 8),
            0x00, 0x00
          };
          id(can_bus).send_data(0x356, false, d356);

          // 4. Gói 0x359 & 0x35C: Cờ cho phép sạc/xả
          uint8_t flag_35c = 0x80; // Cho phép Sạc
          if (id(discharge_master).state) flag_35c |= 0x40; // Cho phép Xả
          std::vector<uint8_t> d359 = {0x00, 0x00, 0x00, 0x00, 0x01, 0x50, 0x4E, 0x00};
          std::vector<uint8_t> d35c = {flag_35c, 0x00};
          std::vector<uint8_t> d35e = {'P', 'Y', 'L', 'O', 'N', ' ', ' ', ' '};
          id(can_bus).send_data(0x359, false, d359);
          id(can_bus).send_data(0x35C, false, d35c);
          id(can_bus).send_data(0x35E, false, d35e);

# Module 1: Đọc JK-BMS qua Bluetooth (Chỉ dùng thư viện esphome-jk-bms chính thức)
esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 2s
    id: bms0

# Khai báo phần cứng CAN trên ESP32 (D4, D5)
canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

# Module 3: Đọc RS485 Modbus từ biến tần Senergy 4kW (D16, D17)
uart:
  id: modbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

modbus:
  id: senergy_modbus
  uart_id: modbus_uart

modbus_controller:
  - id: senergy_inv
    address: 0x01
    modbus_id: senergy_modbus
    update_interval: 5s

# Chân kích xung bật/tắt nguồn JK-BMS (GPIO14 nối qua Opto/Rơ-le vào chân kích BMS)
output:
  - platform: gpio
    pin: GPIO14
    id: bms_pwr_pulse

button:
  - platform: template
    name: "🔄 Kich bat / Tat nguon JK-BMS"
    id: btn_toggle_bms
    on_press:
      - output.turn_on: bms_pwr_pulse
      - delay: 2500ms
      - output.turn_off: bms_pwr_pulse

# Công tắc điều khiển Xả Pin & 4 Lịch xả tùy chọn
switch:
  - platform: template
    name: "☀️ Cho phep Xa Pin (Tong)"
    id: discharge_master
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "⏰ Lich xa 1"
    id: slot1_enable
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "⏰ Lich xa 2"
    id: slot2_enable
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "⏰ Lich xa 3"
    id: slot3_enable
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "⏰ Lich xa 4"
    id: slot4_enable
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# Công tắc cơ vật lý đấu chân D13 (GPIO13) và GND để kích bật/tắt BMS bằng tay
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13
      mode: INPUT_PULLUP
      inverted: true
    name: "Cong tac co kich BMS"
    filters:
      - delayed_on: 50ms
    on_press:
      - button.press: btn_toggle_bms

# Thanh trượt cài đặt dòng áp & 4 Lịch giờ/phút tùy chỉnh
number:
  - platform: template
    name: "⚙️ Dong Sac toi da (A)"
    id: set_charge_current
    min_value: 10
    max_value: 90
    step: 5
    initial_value: 70
    optimistic: true
    restore_value: true
    unit_of_measurement: "A"

  - platform: template
    name: "⚙️ Dong Xa toi da (A)"
    id: set_discharge_current
    min_value: 10
    max_value: 95
    step: 5
    initial_value: 75
    optimistic: true
    restore_value: true
    unit_of_measurement: "A"

  - platform: template
    name: "⚙️ Dien ap ngat xa (V)"
    id: set_cutoff_volt
    min_value: 22.4
    max_value: 26.0
    step: 0.1
    initial_value: 25.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "V"

  # Lịch 1
  - platform: template
    name: "Lich 1 - Gio Bat dau"
    id: s1_start_h
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 16
    optimistic: true
    restore_value: true
  - platform: template
    name: "Lich 1 - Phut Bat dau"
    id: s1_start_m
    min_value: 0
    max_value: 55
    step: 5
    initial_value: 0
    optimistic: true
    restore_value: true
  - platform: template
    name: "Lich 1 - Gio Ket thuc"
    id: s1_end_h
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 7
    optimistic: true
    restore_value: true
  - platform: template
    name: "Lich 1 - Phut Ket thuc"
    id: s1_end_m
    min_value: 0
    max_value: 55
    step: 5
    initial_value: 0
