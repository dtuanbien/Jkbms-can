substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"
  # Phát Wi-Fi dự phòng để luôn truy cập được web nếu mất mạng nhà
  ap:
    ssid: "JKBMS-Senergy-Fallback"
    password: "12345678"

captive_portal:

# Bật giao diện web nội bộ (truy cập tại http://jkbms-senergy.local)
web_server:
  port: 80
  version: 2
  ota: true

ota:
  - platform: esphome

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main
  - source: github://syssi/esphome-jk-bms-can@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 2s
    id: bms0

canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

jk_bms_can:
  - jk_bms_ble_id: bms0
    canbus_id: can_bus
    protocol: PYLON
    update_interval: 1s
    charge_voltage_id: charge_voltage
    charge_current_limit_id: charge_current_limit
    discharge_current_limit_id: discharge_current_limit
    discharge_voltage_id: discharge_voltage

# 4 thanh trượt điều chỉnh thông số trực tiếp trên trang web
number:
  - platform: template
    name: "1. Dien ap sac day (V)"
    id: charge_voltage
    min_value: 26.0
    max_value: 29.2
    step: 0.1
    initial_value: 28.4
    optimistic: true
    restore_value: true
    unit_of_measurement: "V"

  - platform: template
    name: "2. Dien ap ngat xa (V)"
    id: discharge_voltage
    min_value: 22.0
    max_value: 26.5
    step: 0.1
    initial_value: 25.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "V"

  - platform: template
    name: "3. Dong sac toi da (A)"
    id: charge_current_limit
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 70
    optimistic: true
    restore_value: true
    unit_of_measurement: "A"

  - platform: template
    name: "4. Dong xa toi da (A)"
    id: discharge_current_limit
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 75
    optimistic: true
    restore_value: true
    unit_of_measurement: "A"

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      name: "Battery Voltage"
      id: total_voltage
    current:
      name: "Battery Current"
      id: current
    state_of_charge:
      name: "Battery SoC"
      id: state_of_charge
    power_tube_temperature:
      name: "MOS Temperature"
      id: mos_temp
    temperature_sensor_1:
      name: "Battery Temp 1"
      id: temp_1
    min_cell_voltage:
      name: "Min Cell Voltage"
      id: min_cell_voltage
    max_cell_voltage:
      name: "Max Cell Voltage"
      id: max_cell_voltage
