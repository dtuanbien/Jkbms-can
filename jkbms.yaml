esphome:
  name: jkbms-senergy

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

web_server:
  port: 80

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"
  ap:
    ssid: "jkbms-senergy"
    password: "12345678"

captive_portal:

esp32_ble_tracker:

ble_client:
  - mac_address: C8:47:8C:10:79:7A
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main
    refresh: 0s

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    id: bms0

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      name: "Total Voltage"
    current:
      name: "Current"
    power:
      name: "Power"
    state_of_charge:
      name: "State of Charge"
    min_cell_voltage:
      name: "Min Cell Voltage"
    max_cell_voltage:
      name: "Max Cell Voltage"
    delta_cell_voltage:
      name: "Delta Cell Voltage"
    temperature_sensor_1:
      name: "Temperature 1"
    temperature_sensor_2:
      name: "Temperature 2"

canbus:
  - platform: esp32_can
    tx_pin: GPIO5
    rx_pin: GPIO4
    can_id: 4
    bit_rate: 500kbps
