substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"
  blynk_token: "YApwHwb_atq5PAiQzC-0qHsb74EPLW6e"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: WARN

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"
  reboot_timeout: 0s
  ap:
    ssid: "JK-BMS-Fallback"
    password: "12345678"

captive_portal:

# Giữ giao diện Web mượt như bản trước (có sẵn OTA và chế độ Sáng/Tối)
web_server:
  port: 80
  version: 3

ota:
  platform: esphome

# Chỉ thêm đúng phần gửi dữ liệu ra Blynk để xem từ xa qua 4G
http_request:
  useragent: esphome/device
  timeout: 2s
  verify_ssl: false

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 3s
    id: bms0

# Giao tiếp CAN Pylontech sang biến tần Senergy 4kW
canbus:
  - platform: esp32_can
    id: can_bus
    can_id: 4
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

# Nút nhấn vật lý bật/tắt BMS (GPIO25)
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO25
      mode: { input: true, pullup: true }
      inverted: true
    name: "Nut Nhan Co Bat Tat BMS"
    filters: [{ delayed_on: 50ms }]
    on_press:
      then:
        - if:
            condition:
              or: [{ switch.is_on: bms_charge_sw }, { switch.is_on: bms_discharge_sw }]
            then:
              - switch.turn_off: bms_charge_sw
              - switch.turn_off: bms_discharge_sw
            else:
              - switch.turn_on: bms_charge_sw
              - switch.turn_on: bms_discharge_sw

# Các thanh chỉnh thông số CAN
number:
  - platform: template
    name: "CAN Charge Voltage"
    id: can_charge_v
    optimistic: true
    min_value: 25.0
    max_value: 29.2
    step: 0.1
    initial_value: 28.4
    restore_value: true
    unit_of_measurement: "V"
  - platform: template
    name: "CAN Discharge Voltage"
    id: can_discharge_v
    optimistic: true
    min_value: 22.0
    max_value: 26.5
    step: 0.1
    initial_value: 25.0
    restore_value: true
    unit_of_measurement: "V"
  - platform: template
    name: "CAN Charge Current Limit"
    id: can_charge_i
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 70
    restore_value: true
    unit_of_measurement: "A"
  - platform: template
    name: "CAN Discharge Current Limit"
    id: can_discharge_i
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 75
    restore_value: true
    unit_of_measurement: "A"

# Công tắc điều khiển BMS
switch:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    charging: { name: "BMS Charging Switch", id: bms_charge_sw }
    discharging: { name: "BMS Discharging Switch", id: bms_discharge_sw }
    balancer: { name: "BMS Balancer Switch", id: bms_balance_sw }

# Cảm biến đọc từ JK BMS (đầy đủ 8 cell)
sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage: { name: "Battery Voltage", id: total_voltage }
    current: { name: "Battery Current", id: current }
    power: { name: "Battery Power", id: power }
    state_of_charge: { name: "Battery SoC", id: state_of_charge }
    capacity_remaining: { name: "Remaining Capacity", id: rem_capacity }
    power_tube_temperature: { name: "MOS Temperature", id: mos_temp }
    temperature_sensor_1: { name: "Battery Temp 1", id: temp_1 }
    delta_cell_voltage: { name: "Delta Cell Voltage", id: delta_cell_v }
    cell_voltage_1: { name: "Cell 1", id: cell_1 }
    cell_voltage_2: { name: "Cell 2", id: cell_2 }
    cell_voltage_3: { name: "Cell 3", id: cell_3 }
    cell_voltage_4: { name: "Cell 4", id: cell_4 }
    cell_voltage_5: { name: "Cell 5", id: cell_5 }
    cell_voltage_6: { name: "Cell 6", id: cell_6 }
    cell_voltage_7: { name: "Cell 7", id: cell_7 }
    cell_voltage_8: { name: "Cell 8", id: cell_8 }

# Gửi bản tin CAN sang Senergy và đẩy dữ liệu lên Blynk để xem qua 4G
interval:
  - interval: 1s
    then:
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x351
          data: !lambda |-
            uint16_t cv = (uint16_t)(id(can_charge_v).state * 10);
            uint16_t ci = (uint16_t)(id(can_charge_i).state * 10);
            uint16_t di = (uint16_t)(id(can_discharge_i).state * 10);
            uint16_t dv = (uint16_t)(id(can_discharge_v).state * 10);
            return {(uint8_t)(cv & 0xFF), (uint8_t)(cv >> 8), (uint8_t)(ci & 0xFF), (uint8_t)(ci >> 8), (uint8_t)(di & 0xFF), (uint8_t)(di >> 8), (uint8_t)(dv & 0xFF), (uint8_t)(dv >> 8)};
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x355
          data: !lambda |-
            uint16_t soc = isnan(id(state_of_charge).state) ? 50 : (uint16_t)id(state_of_charge).state;
            return {(uint8_t)(soc & 0xFF), (uint8_t)(soc >> 8), 100, 0, 0, 0, 0, 0};
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x356
          data: !lambda |-
            int16_t v = isnan(id(total_voltage).state) ? 2640 : (int16_t)(id(total_voltage).state * 100);
            int16_t i = isnan(id(current).state) ? 0 : (int16_t)(id(current).state * 10);
            int16_t t = isnan(id(temp_1).state) ? 250 : (int16_t)(id(temp_1).state * 10);
            return {(uint8_t)(v & 0xFF), (uint8_t)(v >> 8), (uint8_t)(i & 0xFF), (uint8_t)(i >> 8), (uint8_t)(t & 0xFF), (uint8_t)(t >> 8), 0, 0};
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x35C
          data: !lambda |-
            uint8_t flags = 0;
            if (id(bms_charge_sw).state) flags |= 0x80;
            if (id(bms_discharge_sw).state) flags |= 0x40;
            return {flags, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00};
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x35E
          data: !lambda |-
            return {0x50, 0x59, 0x4C, 0x4F, 0x4E, 0x20, 0x20, 0x20};

  - interval: 10s
    then:
      - if:
          condition: wifi.connected
          then:
            - http_request.get:
                url: !lambda |-
                  std::string u = "http://blynk.cloud{blynk_token}";
                  u += "&V0=" + to_string((int)(isnan(id(state_of_charge).state) ? 0 : id(state_of_charge).state));
                  u += "&V1=" + str_sprintf("%.2f", isnan(id(total_voltage).state) ? 0.0f : id(total_voltage).state);
                  u += "&V2=" + str_sprintf("%.1f", isnan(id(current).state) ? 0.0f : id(current).state);
                  u += "&V8=" + str_sprintf("%.1f", isnan(id(mos_temp).state) ? 0.0f : id(mos_temp).state);
                  u += "&V9=" + str_sprintf("%.1f", isnan(id(temp_1).state) ? 0.0f : id(temp_1).state);
                  u += "&V10=" + str_sprintf("%.3f", isnan(id(delta_cell_v).state) ? 0.0f : id(delta_cell_v).state);
                  u += "&V19=" + str_sprintf("%.1f", isnan(id(rem_capacity).state) ? 0.0f : id(rem_capacity).state);
                  u += "&V11=" + str_sprintf("%.3f", isnan(id(cell_1).state) ? 0.0f : id(cell_1).state);
                  u += "&V12=" + str_sprintf("%.3f", isnan(id(cell_2).state) ? 0.0f : id(cell_2).state);
                  u += "&V13=" + str_sprintf("%.3f", isnan(id(cell_3).state) ? 0.0f : id(cell_3).state);
                  u += "&V14=" + str_sprintf("%.3f", isnan(id(cell_4).state) ? 0.0f : id(cell_4).state);
                  u += "&V15=" + str_sprintf("%.3f", isnan(id(cell_5).state) ? 0.0f : id(cell_5).state);
                  u += "&V16=" + str_sprintf("%.3f", isnan(id(cell_6).state) ? 0.0f : id(cell_6).state);
                  u += "&V17=" + str_sprintf("%.3f", isnan(id(cell_7).state) ? 0.0f : id(cell_7).state);
                  u += "&V18=" + str_sprintf("%.3f", isnan(id(cell_8).state) ? 0.0f : id(cell_8).state);
                  return u;
