substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"
  mqtt_broker: "broker.emqx.io"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"
  ap:
    ssid: "JKBMS-Fallback"
    password: "12345678"

web_server:
  port: 80
  version: 1

mqtt:
  broker: ${mqtt_broker}
  port: 1883
  topic_prefix: jkbms_tuanbien_9988

ota:
  platform: esphome

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 2s
    id: bms0

canbus:
  - platform: esp32_can
    id: can_bus
    can_id: 0x351
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

interval:
  - interval: 1s
    then:
      - lambda: |-
          // 1. Gói 0x351: Giới hạn sạc/xả (28.4V | Sạc 70A | Xả 75A | Cắt xả 25.0V)
          uint16_t charge_v = 284;
          int16_t charge_a = 700;
          int16_t discharge_a = 750;
          uint16_t discharge_v = 250;
          std::vector<uint8_t> data_351 = {
            (uint8_t)(charge_v & 0xFF), (uint8_t)(charge_v >> 8),
            (uint8_t)(charge_a & 0xFF), (uint8_t)(charge_a >> 8),
            (uint8_t)(discharge_a & 0xFF), (uint8_t)(discharge_a >> 8),
            (uint8_t)(discharge_v & 0xFF), (uint8_t)(discharge_v >> 8)
          };
          id(can_bus).send_data(0x351, false, data_351);

          // 2. Gói 0x355: Phần trăm pin (SoC) và Sức khỏe pin (SoH = 100%)
          uint16_t soc = isnan(id(state_of_charge).state) ? 50 : (uint16_t)id(state_of_charge).state;
          uint16_t soh = 100;
          std::vector<uint8_t> data_355 = {
            (uint8_t)(soc & 0xFF), (uint8_t)(soc >> 8),
            (uint8_t)(soh & 0xFF), (uint8_t)(soh >> 8),
            0x00, 0x00, 0x00, 0x00
          };
          id(can_bus).send_data(0x355, false, data_355);

          // 3. Gói 0x356: Điện áp thực, Dòng thực, Nhiệt độ thực
          int16_t volt = isnan(id(total_voltage).state) ? 2640 : (int16_t)(id(total_voltage).state * 100);
          int16_t curr = isnan(id(current).state) ? 0 : (int16_t)(id(current).state * 10);
          int16_t temp = isnan(id(mos_temp).state) ? 250 : (int16_t)(id(mos_temp).state * 10);
          std::vector<uint8_t> data_356 = {
            (uint8_t)(volt & 0xFF), (uint8_t)(volt >> 8),
            (uint8_t)(curr & 0xFF), (uint8_t)(curr >> 8),
            (uint8_t)(temp & 0xFF), (uint8_t)(temp >> 8),
            0x00, 0x00
          };
          id(can_bus).send_data(0x356, false, data_356);

          // 4. Gói 0x359 & 0x35C: Cho phép sạc/xả
          std::vector<uint8_t> data_359 = {0x00, 0x00, 0x00, 0x00, 0x01, 0x50, 0x4E, 0x00};
          id(can_bus).send_data(0x359, false, data_359);

          std::vector<uint8_t> data_35c = {0xC0, 0x00};
          id(can_bus).send_data(0x35C, false, data_35c);

          // 5. Gói 0x35E: Tên định danh PYLON
          std::vector<uint8_t> data_35e = {'P', 'Y', 'L', 'O', 'N', ' ', ' ', ' '};
          id(can_bus).send_data(0x35E, false, data_35e);

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      name: "Tong dien ap"
      id: total_voltage
    current:
      name: "Dong sac xa"
      id: current
    power:
      name: "Cong suat"
    state_of_charge:
      name: "Phan tram pin"
      id: state_of_charge
    power_tube_temperature:
      name: "Nhiet do MOS"
      id: mos_temp
    temperature_sensor_1:
      name: "Nhiet do pin 1"
      id: temp_1
    min_cell_voltage:
      name: "Cell thap nhat"
      id: min_cell_voltage
    max_cell_voltage:
      name: "Cell cao nhat"
      id: max_cell_voltage
    delta_cell_voltage:
      name: "Do lech cell"
    cell_voltage_1:
      name: "Cell 1"
    cell_voltage_2:
      name: "Cell 2"
    cell_voltage_3:
      name: "Cell 3"
    cell_voltage_4:
      name: "Cell 4"
    cell_voltage_5:
      name: "Cell 5"
    cell_voltage_6:
      name: "Cell 6"
    cell_voltage_7:
      name: "Cell 7"
    cell_voltage_8:
      name: "Cell 8"
