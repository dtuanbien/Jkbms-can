substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"
  ap:
    ssid: "JKBMS-Fallback"
    password: "12345678"

captive_portal:

web_server:
  port: 80

ota:
  platform: esphome

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 2s
    id: bms0

canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO4
    rx_pin: GPIO5
    can_id: 0x351
    bit_rate: 500kbps

number:
  - platform: template
    name: "1. Dien ap sac day (V)"
    id: max_charge_v
    optimistic: true
    min_value: 26.0
    max_value: 29.2
    step: 0.1
    initial_value: 28.4
    restore_value: true

  - platform: template
    name: "2. Dien ap ngat xa (V)"
    id: min_discharge_v
    optimistic: true
    min_value: 22.0
    max_value: 26.5
    step: 0.1
    initial_value: 25.0
    restore_value: true

  - platform: template
    name: "3. Dong sac toi da (A)"
    id: max_charge_a
    optimistic: true
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 70
    restore_value: true

  - platform: template
    name: "4. Dong xa toi da (A)"
    id: max_discharge_a
    optimistic: true
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 75
    restore_value: true

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      name: "Battery Voltage"
      id: total_voltage
    current:
      name: "Battery Current"
      id: current
    state_of_charge:
      name: "Battery SoC"
      id: state_of_charge
    power_tube_temperature:
      name: "MOS Temperature"
      id: mos_temp
    temperature_sensor_1:
      name: "Battery Temp 1"
      id: temp_1
    min_cell_voltage:
      name: "Min Cell Voltage"
      id: min_cell_voltage
    max_cell_voltage:
      name: "Max Cell Voltage"
      id: max_cell_voltage

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (isnan(id(total_voltage).state) || isnan(id(state_of_charge).state)) {
            return;
          }
          uint16_t charge_v = (uint16_t)(id(max_charge_v).state * 10);
          int16_t charge_a = (int16_t)(id(max_charge_a).state * 10);
          int16_t discharge_a = (int16_t)(id(max_discharge_a).state * 10);
          uint16_t discharge_v = (uint16_t)(id(min_discharge_v).state * 10);
          std::vector<uint8_t> data_351 = {
            (uint8_t)(charge_v & 0xFF), (uint8_t)(charge_v >> 8),
            (uint8_t)(charge_a & 0xFF), (uint8_t)(charge_a >> 8),
            (uint8_t)(discharge_a & 0xFF), (uint8_t)(discharge_a >> 8),
            (uint8_t)(discharge_v & 0xFF), (uint8_t)(discharge_v >> 8)
          };
          id(can_bus)->send_data(0x351, false, data_351);

          uint16_t soc = (uint16_t)id(state_of_charge).state;
          uint16_t soh = 100;
          std::vector<uint8_t> data_355 = {
            (uint8_t)(soc & 0xFF), (uint8_t)(soc >> 8),
            (uint8_t)(soh & 0xFF), (uint8_t)(soh >> 8),
            0x00, 0x00, 0x00, 0x00
          };
          id(can_bus)->send_data(0x355, false, data_355);

          int16_t volt = (int16_t)(id(total_voltage).state * 100);
          int16_t curr = isnan(id(current).state) ? 0 : (int16_t)(id(current).state * 10);
          int16_t temp = isnan(id(temp_1).state) ? 250 : (int16_t)(id(temp_1).state * 10);
          std::vector<uint8_t> data_356 = {
            (uint8_t)(volt & 0xFF), (uint8_t)(volt >> 8),
            (uint8_t)(curr & 0xFF), (uint8_t)(curr >> 8),
            (uint8_t)(temp & 0xFF), (uint8_t)(temp >> 8),
            0x00, 0x00
          };
          id(can_bus)->send_data(0x356, false, data_356);

          std::vector<uint8_t> data_359 = {0x00, 0x00, 0x00, 0x00, 0x01, 0x50, 0x4E, 0x00};
          id(can_bus)->send_data(0x359, false, data_359);

          std::vector<uint8_t> data_35c = {0xC0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00};
          id(can_bus)->send_data(0x35C, false, data_35c);

          std::vector<uint8_t> data_35e = {'P', 'Y', 'L', 'O', 'N', ' ', ' ', ' '};
          id(can_bus)->send_data(0x35E, false, data_35e);
