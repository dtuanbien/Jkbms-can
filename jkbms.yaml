substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"
  battery_capacity_ah: "280.0"
  blynk_token: "YApwHwb_atq5PAiQzC-0qHsb74EPLW6e"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

web_server:
  port: 80
  version: 2

ota:
  - platform: esphome
  - platform: web_server

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"
  manual_ip:
    static_ip: 192.168.1.200
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
    dns2: 1.1.1.1

http_request:
  id: blynk_http
  timeout: 5s
  verify_ssl: false

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Ho_Chi_Minh
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lambda: |-
              auto now = id(sntp_time).now();
              if (!now.is_valid()) return;
              int cur_mins = now.hour * 60 + now.minute;

              auto in_range = [&](int sh, int sm, int eh, int em) {
                int start = sh * 60 + sm;
                int end = eh * 60 + em;
                if (start <= end) return (cur_mins >= start && cur_mins < end);
                else return (cur_mins >= start || cur_mins < end);
              };

              bool active = false;
              if (id(slot1_enable).state && in_range(id(s1_start_h).state, id(s1_start_m).state, id(s1_end_h).state, id(s1_end_m).state)) active = true;
              if (id(slot2_enable).state && in_range(id(s2_start_h).state, id(s2_start_m).state, id(s2_end_h).state, id(s2_end_m).state)) active = true;

              if (id(discharge_master).state != active) {
                if (active) id(discharge_master).turn_on();
                else id(discharge_master).turn_off();
              }

interval:
  - interval: 1s
    then:
      - lambda: |-
          uint16_t chg_v = (uint16_t)(id(set_charge_volt).state * 10);
          uint16_t chg_i = (uint16_t)(id(set_charge_current).state * 10);
          uint16_t dis_i = id(discharge_master).state ? (uint16_t)(id(set_discharge_current).state * 10) : 0;
          uint16_t dis_v = (uint16_t)(id(set_cutoff_volt).state * 10);
          std::vector<uint8_t> d351 = {
            (uint8_t)(chg_v & 0xFF), (uint8_t)(chg_v >> 8),
            (uint8_t)(chg_i & 0xFF), (uint8_t)(chg_i >> 8),
            (uint8_t)(dis_i & 0xFF), (uint8_t)(dis_i >> 8),
            (uint8_t)(dis_v & 0xFF), (uint8_t)(dis_v >> 8)
          };
          id(can_bus).send_data(0x351, false, d351);

          uint16_t soc = isnan(id(state_of_charge).state) ? 50 : (uint16_t)id(state_of_charge).state;
          uint16_t soh = 100;
          std::vector<uint8_t> d355 = {
            (uint8_t)(soc & 0xFF), (uint8_t)(soc >> 8),
            (uint8_t)(soh & 0xFF), (uint8_t)(soh >> 8),
            0x00, 0x00, 0x00, 0x00
          };
          id(can_bus).send_data(0x355, false, d355);

          int16_t v_real = isnan(id(total_voltage).state) ? 2600 : (int16_t)(id(total_voltage).state * 100);
          int16_t i_real = isnan(id(current).state) ? 0 : (int16_t)(id(current).state * 10);
          int16_t t_real = isnan(id(mos_temp).state) ? 250 : (int16_t)(id(mos_temp).state * 10);
          std::vector<uint8_t> d356 = {
            (uint8_t)(v_real & 0xFF), (uint8_t)(v_real >> 8),
            (uint8_t)(i_real & 0xFF), (uint8_t)(i_real >> 8),
            (uint8_t)(t_real & 0xFF), (uint8_t)(t_real >> 8),
            0x00, 0x00
          };
          id(can_bus).send_data(0x356, false, d356);

          uint8_t flag_35c = 0x80;
          if (id(discharge_master).state) flag_35c |= 0x40;
          std::vector<uint8_t> d359 = {0x00, 0x00, 0x00, 0x00, 0x01, 0x50, 0x4E, 0x00};
          std::vector<uint8_t> d35c = {flag_35c, 0x00};
          std::vector<uint8_t> d35e = {'P', 'Y', 'L', 'O', 'N', ' ', ' ', ' '};
          id(can_bus).send_data(0x359, false, d359);
          id(can_bus).send_data(0x35C, false, d35c);
          id(can_bus).send_data(0x35E, false, d35e);

  - interval: 5s
    then:
      - lambda: |-
          if (id(blynk_http).is_ready()) {
            char url[384];
            float soc = isnan(id(state_of_charge).state) ? 0.0f : id(state_of_charge).state;
            float v_bat = isnan(id(total_voltage).state) ? 0.0f : id(total_voltage).state;
            float i_bat = isnan(id(current).state) ? 0.0f : id(current).state;
            float pv = isnan(id(pv_power).state) ? 0.0f : id(pv_power).state;
            float grid = isnan(id(grid_power).state) ? 0.0f : id(grid_power).state;
            float load = isnan(id(load_power).state) ? 0.0f : id(load_power).state;
            float ah_rem = isnan(id(remaining_ah).state) ? 0.0f : id(remaining_ah).state;
            float delta_mv = isnan(id(delta_cell_voltage).state) ? 0.0f : (id(delta_cell_voltage).state * 1000.0f);
            snprintf(url, sizeof(url),
                     "http://blynk.cloud/external/api/batch/update?token=${blynk_token}&v0=%.1f&v1=%.2f&v2=%.1f&v3=%.0f&v4=%.0f&v5=%.0f&v6=%.1f&v7=%.0f",
                     soc, v_bat, i_bat, pv, grid, load, ah_rem, delta_mv);
            id(blynk_http).post(url, "");
          }

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 2s
    id: bms0

canbus:
  - platform: esp32_can
    id: can_bus
    can_id: 0x351
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

uart:
  id: modbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

modbus:
  id: senergy_modbus
  uart_id: modbus_uart
  send_wait_time: 100ms

modbus_controller:
  - id: senergy_inv
    address: 0x01
    modbus_id: senergy_modbus
    update_interval: 15s

output:
  - platform: gpio
    pin: GPIO14
    id: bms_pwr_pulse

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    id: grid_export_limit_out
    address: 0x0046
    register_type: holding
    value_type: U_WORD
    write_lambda: |-
      return (uint16_t)x;

button:
  - platform: template
    name: "Kich bat / Tat nguon JK-BMS"
    id: btn_toggle_bms
    on_press:
      - output.turn_on: bms_pwr_pulse
      - delay: 2500ms
      - output.turn_off: bms_pwr_pulse

switch:
  - platform: template
    name: "Cho phep Xa Pin (Tong)"
    id: discharge_master
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Lich xa 1"
    id: slot1_enable
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Lich xa 2"
    id: slot2_enable
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13
      mode: INPUT_PULLUP
      inverted: true
    name: "Cong tac co kich BMS"
    filters:
      - delayed_on: 50ms
    on_press:
      - button.press: btn_toggle_bms

number:
  - platform: template
    name: "Dien ap sac (V)"
    id: set_charge_volt
    min_value: 26.0
    max_value: 29.2
    step: 0.1
    initial_value: 28.4
    optimistic: true
    restore_value: true
    unit_of_measurement: "V"

  - platform: template
    name: "Dong Sac toi da (A)"
    id: set_charge_current
    min_value: 10
    max_value: 90
    step: 5
    initial_value: 70
    optimistic: true
    restore_value: true
    unit_of_measurement: "A"

  - platform: template
    name: "Dong Xa toi da (A)"
    id: set_discharge_current
    min_value: 10
    max_value: 95
    step: 5
    initial_value: 75
    optimistic: true
    restore_value: true
    unit_of_measurement: "A"

  - platform: template
    name: "Dien ap ngat xa (V)"
    id: set_cutoff_volt
    min_value: 22.4
    max_value: 26.0
    step: 0.1
    initial_value: 25.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "V"

  - platform: template
    name: "Cong suat day luoi toi da (W)"
    id: set_grid_export_power
    min_value: 0
    max_value: 4000
    step: 100
    initial_value: 0
    optimistic: true
    restore_value: true
    unit_of_measurement: "W"
    set_action:
      - output.set_level:
          id: grid_export_limit_out
          level: !lambda "return x / 4000.0f;"

  - platform: template
    name: "Lich 1 - Gio Bat dau"
    id: s1_start_h
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 16
    optimistic: true
    restore_value: true
  - platform: template
    name: "Lich 1 - Phut Bat dau"
    id: s1_start_m
    min_value: 0
    max_value: 55
    step: 5
    initial_value: 0
    optimistic: true
    restore_value: true
  - platform: template
    name: "Lich 1 - Gio Ket thuc"
    id: s1_end_h
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 7
    optimistic: true
    restore_value: true
  - platform: template
    name: "Lich 1 - Phut Ket thuc"
    id: s1_end_m
    min_value: 0
    max_value: 55
    step: 5
    initial_value: 0
    optimistic: true
    restore_value: true

  - platform: template
    name: "Lich 2 - Gio Bat dau"
    id: s2_start_h
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
  - platform: template
    name: "Lich 2 - Phut Bat dau"
    id: s2_start_m
    min_value: 0
    max_value: 55
    step: 5
    initial_value: 0
    optimistic: true
    restore_value: true
  - platform: template
    name: "Lich 2 - Gio Ket thuc"
    id: s2_end_h
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
  - platform: template
    name: "Lich 2 - Phut Ket thuc"
    id: s2_end_m
    min_value: 0
    max_value: 55
    step: 5
    initial_value: 0
    optimistic: true
    restore_value: true

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      name: "Dien ap Pin (V)"
      id: total_voltage
    current:
      name: "Dong Pin (A)"
      id: current
    power:
      name: "Cong suat Pin BMS (W)"
      id: bms_power
    state_of_charge:
      name: "Dung luong Pin (%)"
      id: state_of_charge
    min_cell_voltage:
      name: "Cell thap nhat (V)"
      id: min_cell_voltage
    max_cell_voltage:
      name: "Cell cao nhat (V)"
      id: max_cell_voltage
    delta_cell_voltage:
      name: "Lech ap Cell (V)"
      id: delta_cell_voltage
    power_tube_temperature:
      name: "Nhiet do MOS (C)"
      id: mos_temp
    cell_voltage_1:
      name: "Cell 1 (V)"
      id: cell_1
    cell_voltage_2:
      name: "Cell 2 (V)"
      id: cell_2
    cell_voltage_3:
      name: "Cell 3 (V)"
      id: cell_3
    cell_voltage_4:
      name: "Cell 4 (V)"
      id: cell_4
    cell_voltage_5:
      name: "Cell 5 (V)"
      id: cell_5
    cell_voltage_6:
      name: "Cell 6 (V)"
      id: cell_6
    cell_voltage_7:
      name: "Cell 7 (V)"
      id: cell_7
    cell_voltage_8:
      name: "Cell 8 (V)"
      id: cell_8

  - platform: template
    name: "Dung luong luu tru con lai (Ah)"
    id: remaining_ah
    unit_of_measurement: "Ah"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (isnan(id(state_of_charge).state)) return {};
      return id(state_of_charge).state * ${battery_capacity_ah} / 100.0f;

  - platform: template
    name: "Nang luong pin uoc tinh (Wh)"
    id: remaining_wh
    unit_of_measurement: "Wh"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (isnan(id(remaining_ah).state) || isnan(id(total_voltage).state)) return {};
      return id(remaining_ah).state * id(total_voltage).state;

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Cong suat Mat troi PV (W)"
    id: pv_power
    register_type: holding
    address: 0x0002
    value_type: U_WORD
    unit_of_measurement: "W"

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Cong suat Hoa luoi / Luoi (W)"
    id: grid_power
    register_type: holding
    address: 0x000A
    value_type: S_WORD
    unit_of_measurement: "W"

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Cong suat Tai tieu thu (W)"
    id: load_power
    register_type: holding
    address: 0x000C
    value_type: U_WORD
    unit_of_measurement: "W"

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Cong suat Sac/Xa Bien tan (W)"
    id: bat_power
    register_type: holding
    address: 0x000E
    value_type: S_WORD
    unit_of_measurement: "W"
