esphome:
  name: jkbms-senergy

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

web_server:
  port: 80

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"
  ap:
    ssid: "jkbms-senergy"
    password: "12345678"

captive_portal:

esp32_ble_tracker:

ble_client:
  - mac_address: C8:47:8C:10:79:7A
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main
    refresh: 0s

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    id: bms0

uart:
  - id: mod_bus
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600

modbus:
  id: senergy_modbus
  uart_id: mod_bus

modbus_controller:
  - id: senergy_inverter
    address: 0x01
    modbus_id: senergy_modbus
    setup_priority: -10
    update_interval: 5s

sensor:
  # --- THÔNG SỐ PIN JK BMS ---
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      name: "Pin - Total Voltage"
      id: bms_voltage
    current:
      name: "Pin - Current"
      id: bms_current
    power:
      name: "Pin - Power"
    state_of_charge:
      name: "Pin - State of Charge"
      id: bms_soc
    min_cell_voltage:
      name: "Pin - Min Cell Voltage"
    max_cell_voltage:
      name: "Pin - Max Cell Voltage"
    delta_cell_voltage:
      name: "Pin - Delta Cell Voltage"
    temperature_sensor_1:
      name: "Pin - Temperature 1"
      id: bms_temp1
    temperature_sensor_2:
      name: "Pin - Temperature 2"

  # --- THÔNG SỐ BIẾN TẦN SENERGY (RS485) ---
  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - Cong Suat PV1 (W)"
    register_type: read
    address: 0x1004
    unit_of_measurement: "W"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - Cong Suat PV2 (W)"
    register_type: read
    address: 0x1005
    unit_of_measurement: "W"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - Dien Ap Luoi (V)"
    register_type: read
    address: 0x1008
    unit_of_measurement: "V"
    value_type: U_WORD
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - Cong Suat Tai (W)"
    register_type: read
    address: 0x1010
    unit_of_measurement: "W"
    value_type: S_WORD

  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - Cong Suat Luoi (W)"
    register_type: read
    address: 0x1012
    unit_of_measurement: "W"
    value_type: S_WORD

number:
  # --- CHỈNH ÁP & DÒNG SẠC XẢ GỬI QUA CAN PYLONTECH ---
  - platform: template
    name: "CAN - Ap Sac Toi Da (V)"
    id: charge_voltage
    min_value: 24.0
    max_value: 30.0
    step: 0.1
    initial_value: 28.4
    optimistic: true
    restore_value: true

  - platform: template
    name: "CAN - Ap Cat Xa (V)"
    id: discharge_voltage
    min_value: 20.0
    max_value: 26.0
    step: 0.1
    initial_value: 22.0
    optimistic: true
    restore_value: true

  - platform: template
    name: "CAN - Dong Sac Toi Da (A)"
    id: max_charge_current
    min_value: 1
    max_value: 150
    step: 1
    initial_value: 50
    optimistic: true
    restore_value: true

  - platform: template
    name: "CAN - Dong Xa Toi Da (A)"
    id: max_discharge_current
    min_value: 1
    max_value: 150
    step: 1
    initial_value: 80
    optimistic: true
    restore_value: true

  # --- CÀI ĐẶT TRỰC TIẾP TRÊN BIẾN TẦN SENERGY (RS485) ---
  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - Gioi Han Dong Sac (A)"
    address: 0x2002
    value_type: U_WORD
    min_value: 0
    max_value: 120
    step: 1
    multiply: 10

  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - SOC Cat Xa Toi Thieu (%)"
    address: 0x2005
    value_type: U_WORD
    min_value: 5
    max_value: 90
    step: 1

  # --- CÀI ĐẶT TRÊN MẠCH JK BMS ---
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    cell_count:
      name: "Pin - So Cell"
    total_battery_capacity:
      name: "Pin - Dung Luong (Ah)"

switch:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    charging:
      name: "Pin - Cong Tac Sac BMS"
    discharging:
      name: "Pin - Cong Tac Xa BMS"
    balancer:
      name: "Pin - Can Bang Cell"

  - platform: modbus_controller
    modbus_controller_id: senergy_inverter
    name: "Senergy - Cho Phep Day Luoi"
    register_type: holding
    address: 0x2000
    bitmask: 1

canbus:
  - platform: esp32_can
    tx_pin: GPIO5
    rx_pin: GPIO4
    can_id: 4
    bit_rate: 500kbps
    id: my_canbus

interval:
  - interval: 1s
    then:
      - lambda: |-
          uint16_t cv = (uint16_t)(id(charge_voltage).state * 10);
          uint16_t ccl = (uint16_t)(id(max_charge_current).state * 10);
          uint16_t dcl = (uint16_t)(id(max_discharge_current).state * 10);
          uint16_t dv = (uint16_t)(id(discharge_voltage).state * 10);
          std::vector<uint8_t> data_351 = {
            (uint8_t)(cv & 0xFF), (uint8_t)((cv >> 8) & 0xFF),
            (uint8_t)(ccl & 0xFF), (uint8_t)((ccl >> 8) & 0xFF),
            (uint8_t)(dcl & 0xFF), (uint8_t)((dcl >> 8) & 0xFF),
            (uint8_t)(dv & 0xFF), (uint8_t)((dv >> 8) & 0xFF)
          };
          id(my_canbus).send_data(0x351, false, data_351);

          uint16_t soc = (uint16_t)id(bms_soc).state;
          if (soc > 100) soc = 100;
          std::vector<uint8_t> data_355 = {
            (uint8_t)(soc & 0xFF), (uint8_t)((soc >> 8) & 0xFF),
            100, 0,
            (uint8_t)((soc * 100) & 0xFF), (uint8_t)(((soc * 100) >> 8) & 0xFF)
          };
          id(my_canbus).send_data(0x355, false, data_355);

          int16_t v = (int16_t)(id(bms_voltage).state * 100);
          int16_t i = (int16_t)(id(bms_current).state * 10);
          int16_t t = (int16_t)(id(bms_temp1).state * 10);
          std::vector<uint8_t> data_356 = {
            (uint8_t)(v & 0xFF), (uint8_t)((v >> 8) & 0xFF),
            (uint8_t)(i & 0xFF), (uint8_t)((i >> 8) & 0xFF),
            (uint8_t)(t & 0xFF), (uint8_t)((t >> 8) & 0xFF)
          };
          id(my_canbus).send_data(0x356, false, data_356);

          std::vector<uint8_t> data_359 = {0, 0, 0, 0, 2, 0x50, 0x4E};
          id(my_canbus).send_data(0x359, false, data_359);

          std::vector<uint8_t> data_35e = {'P', 'Y', 'L', 'O', 'N', ' ', ' ', ' '};
          id(my_canbus).send_data(0x35E, false, data_35e);
