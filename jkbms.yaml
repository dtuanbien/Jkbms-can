substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"
  blynk_token: "DAN_MA_BLYNK_AUTH_TOKEN_CUA_BAN_VAO_DAY"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: WARN

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"
  reboot_timeout: 0s
  manual_ip:
    static_ip: 192.168.1.200
    gateway: 192.168.1.1
    subnet: 255.255.255.0

  # Điểm phát WiFi dự phòng tự kích hoạt khi mất mạng nhà
  ap:
    ssid: "JK-BMS-Fallback"
    password: "12345678"

captive_portal:

web_server:
  port: 80
  version: 3

http_request:
  useragent: esphome/device
  timeout: 3s

ota:
  platform: esphome

# ==========================================
# 1. BLUETOOTH JK BMS
# ==========================================
esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 3s
    id: bms0

# ==========================================
# 2. CỔNG CAN PYLONTECH GỬI SENERGY 4KW
# ==========================================
canbus:
  - platform: esp32_can
    id: can_bus
    can_id: 4
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

interval:
  # Gửi dữ liệu CAN sang biến tần mỗi 1 giây (Chạy độc lập kể cả khi mất WiFi)
  - interval: 1s
    then:
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x351
          data: !lambda |-
            uint16_t cv = (uint16_t)(id(can_charge_v).state * 10);
            uint16_t ci = (uint16_t)(id(can_charge_i).state * 10);
            uint16_t di = (uint16_t)(id(can_discharge_i).state * 10);
            uint16_t dv = (uint16_t)(id(can_discharge_v).state * 10);
            return {
              (uint8_t)(cv & 0xFF), (uint8_t)(cv >> 8),
              (uint8_t)(ci & 0xFF), (uint8_t)(ci >> 8),
              (uint8_t)(di & 0xFF), (uint8_t)(di >> 8),
              (uint8_t)(dv & 0xFF), (uint8_t)(dv >> 8)
            };
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x355
          data: !lambda |-
            uint16_t soc = isnan(id(state_of_charge).state) ? 50 : (uint16_t)id(state_of_charge).state;
            return {(uint8_t)(soc & 0xFF), (uint8_t)(soc >> 8), 100, 0, 0, 0, 0, 0};
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x356
          data: !lambda |-
            int16_t v = isnan(id(total_voltage).state) ? 2640 : (int16_t)(id(total_voltage).state * 100);
            int16_t i = isnan(id(current).state) ? 0 : (int16_t)(id(current).state * 10);
            int16_t t = isnan(id(temp_1).state) ? 250 : (int16_t)(id(temp_1).state * 10);
            return {
              (uint8_t)(v & 0xFF), (uint8_t)(v >> 8),
              (uint8_t)(i & 0xFF), (uint8_t)(i >> 8),
              (uint8_t)(t & 0xFF), (uint8_t)(t >> 8), 0, 0
            };
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x35C
          data: [0xC0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x35E
          data: [0x50, 0x59, 0x4C, 0x4F, 0x4E, 0x20, 0x20, 0x20]

  # Đẩy thông số lên App Blynk mỗi 5 giây (Chỉ chạy khi có WiFi)
  - interval: 5s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                url: !lambda |-
                  char buf[350];
                  float soc = isnan(id(state_of_charge).state) ? 0 : id(state_of_charge).state;
                  float v = isnan(id(total_voltage).state) ? 0 : id(total_voltage).state;
                  float i = isnan(id(current).state) ? 0 : id(current).state;
                  float pv1 = isnan(id(pv1_power).state) ? 0 : id(pv1_power).state;
                  float load = isnan(id(load_power).state) ? 0 : id(load_power).state;
                  float grid_v = isnan(id(grid_voltage).state) ? 0 : id(grid_voltage).state;
                  float mos_t = isnan(id(mos_temp).state) ? 0 : id(mos_temp).state;
                  float bat_t = isnan(id(temp_1).state) ? 0 : id(temp_1).state;
                  float delta_v = isnan(id(delta_cell_v).state) ? 0 : id(delta_cell_v).state;
                  snprintf(buf, sizeof(buf),
                    "http://blynk.cloud{blynk_token}&V0=%.0f&V1=%.2f&V2=%.1f&V3=%.0f&V4=%.0f&V7=%.1f&V8=%.1f&V9=%.1f&V10=%.3f",
                    soc, v, i, pv1, load, grid_v, mos_t, bat_t, delta_v);
                  return std::string(buf);

  # Đẩy điện áp 8 Cell lên App Blynk mỗi 8 giây (Chỉ chạy khi có WiFi)
  - interval: 8s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                url: !lambda |-
                  char buf[350];
                  float c1 = isnan(id(cell_1).state) ? 0 : id(cell_1).state;
                  float c2 = isnan(id(cell_2).state) ? 0 : id(cell_2).state;
                  float c3 = isnan(id(cell_3).state) ? 0 : id(cell_3).state;
                  float c4 = isnan(id(cell_4).state) ? 0 : id(cell_4).state;
                  float c5 = isnan(id(cell_5).state) ? 0 : id(cell_5).state;
                  float c6 = isnan(id(cell_6).state) ? 0 : id(cell_6).state;
                  float c7 = isnan(id(cell_7).state) ? 0 : id(cell_7).state;
                  float c8 = isnan(id(cell_8).state) ? 0 : id(cell_8).state;
                  snprintf(buf, sizeof(buf),
                    "http://blynk.cloud{blynk_token}&V11=%.3f&V12=%.3f&V13=%.3f&V14=%.3f&V15=%.3f&V16=%.3f&V17=%.3f&V18=%.3f",
                    c1, c2, c3, c4, c5, c6, c7, c8);
                  return std::string(buf);

  # Đọc lệnh điều khiển Công suất đẩy lưới (V6) & Bật/Tắt đẩy lưới (V5) từ Blynk
  - interval: 6s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                url: "http://blynk.cloud{blynk_token}&V6"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          float val = atof(body.c_str());
                          if (val >= 0 && val <= 4000 && val != id(senergy_export_limit).state) {
                            auto call = id(senergy_export_limit).make_call();
                            call.set_value(val);
                            call.perform();
                          }
                        }
            - http_request.get:
                url: "http://blynk.cloud{blynk_token}&V5"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          int sw = atoi(body.c_str());
                          if (sw == 1 && !id(senergy_export_sw).state) {
                            id(senergy_export_sw).turn_on();
                          } else if (sw == 0 && id(senergy_export_sw).state) {
                            id(senergy_export_sw).turn_off();
                          }
                        }

  # Đọc lệnh Thanh trượt Điện áp sạc CAN (V22), Dòng sạc CAN (V23), Dòng xả CAN (V24) từ Blynk
  - interval: 7s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                url: "http://blynk.cloud{blynk_token}&V22"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          float val = atof(body.c_str());
                          if (val >= 25.0 && val <= 29.2 && fabs(val - id(can_charge_v).state) > 0.05) {
                            auto call = id(can_charge_v).make_call();
                            call.set_value(val);
                            call.perform();
                          }
                        }
            - http_request.get:
                url: "http://blynk.cloud{blynk_token}&V23"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          float val = atof(body.c_str());
                          if (val >= 0 && val <= 100 && val != id(can_charge_i).state) {
                            auto call = id(can_charge_i).make_call();
                            call.set_value(val);
                            call.perform();
                          }
                        }
            - http_request.get:
                url: "http://blynk.cloud{blynk_token}&V24"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          float val = atof(body.c_str());
                          if (val >= 0 && val <= 150 && val != id(can_discharge_i).state) {
                            auto call = id(can_discharge_i).make_call();
                            call.set_value(val);
                            call.perform();
                          }
                        }

# ==========================================
# 3. GIAO TIẾP RS485 VỚI BIẾN TẦN SENERGY
# ==========================================
uart:
  - id: uart_rs485
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600

modbus:
  - id: modbus_senergy
    uart_id: uart_rs485

modbus_controller:
  - id: senergy_inv
    address: 0x01
    modbus_id: modbus_senergy
    update_interval: 5s

