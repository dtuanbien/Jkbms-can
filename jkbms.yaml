substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"
  ap:
    ssid: "JKBMS-Senergy-Fallback"
    password: "12345678"

captive_portal:

web_server:
  port: 80
  version: 2

ota:
  - platform: esphome
  - platform: web_server

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 2s
    id: bms0

canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

number:
  - platform: template
    name: "1. Dien ap sac day (V)"
    id: charge_voltage
    min_value: 26.0
    max_value: 29.2
    step: 0.1
    initial_value: 28.4
    optimistic: true
    restore_value: true
    unit_of_measurement: "V"

  - platform: template
    name: "2. Dien ap ngat xa (V)"
    id: discharge_voltage
    min_value: 22.0
    max_value: 26.5
    step: 0.1
    initial_value: 25.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "V"

  - platform: template
    name: "3. Dong sac toi da (A)"
    id: charge_current_limit
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 70
    optimistic: true
    restore_value: true
    unit_of_measurement: "A"

  - platform: template
    name: "4. Dong xa toi da (A)"
    id: discharge_current_limit
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 75
    optimistic: true
    restore_value: true
    unit_of_measurement: "A"

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      name: "Battery Voltage"
      id: total_voltage
    current:
      name: "Battery Current"
      id: current
    state_of_charge:
      name: "Battery SoC"
      id: state_of_charge
    power_tube_temperature:
      name: "MOS Temperature"
      id: mos_temp
    temperature_sensor_1:
      name: "Battery Temp 1"
      id: temp_1
    min_cell_voltage:
      name: "Min Cell Voltage"
      id: min_cell_voltage
    max_cell_voltage:
      name: "Max Cell Voltage"
      id: max_cell_voltage

interval:
  - interval: 1s
    then:
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x351
          data: !lambda |-
            uint16_t cv = (uint16_t)(id(charge_voltage).state * 10);
            uint16_t ccl = (uint16_t)(id(charge_current_limit).state * 10);
            uint16_t dcl = (uint16_t)(id(discharge_current_limit).state * 10);
            uint16_t dv = (uint16_t)(id(discharge_voltage).state * 10);
            return {
              (uint8_t)(cv & 0xFF), (uint8_t)(cv >> 8),
              (uint8_t)(ccl & 0xFF), (uint8_t)(ccl >> 8),
              (uint8_t)(dcl & 0xFF), (uint8_t)(dcl >> 8),
              (uint8_t)(dv & 0xFF), (uint8_t)(dv >> 8)
            };

      - canbus.send:
          canbus_id: can_bus
          can_id: 0x355
          data: !lambda |-
            uint16_t soc = isnan(id(state_of_charge).state) ? 50 : (uint16_t)(id(state_of_charge).state);
            uint16_t soh = 100;
            return {
              (uint8_t)(soc & 0xFF), (uint8_t)(soc >> 8),
              (uint8_t)(soh & 0xFF), (uint8_t)(soh >> 8)
            };

      - canbus.send:
          canbus_id: can_bus
          can_id: 0x356
          data: !lambda |-
            int16_t volt = isnan(id(total_voltage).state) ? 2600 : (int16_t)(id(total_voltage).state * 100);
            int16_t curr = isnan(id(current).state) ? 0 : (int16_t)(id(current).state * 10);
            int16_t temp = isnan(id(temp_1).state) ? 250 : (int16_t)(id(temp_1).state * 10);
            return {
              (uint8_t)(volt & 0xFF), (uint8_t)(volt >> 8),
              (uint8_t)(curr & 0xFF), (uint8_t)(curr >> 8),
              (uint8_t)(temp & 0xFF), (uint8_t)(temp >> 8)
            };

      - canbus.send:
          canbus_id: can_bus
          can_id: 0x359
          data: [0x00, 0x00, 0x00, 0x00, 0x01, 0x50, 0x4E, 0x00]

      - canbus.send:
          canbus_id: can_bus
          can_id: 0x35C
          data: [0xC0, 0x00]

      - canbus.send:
          canbus_id: can_bus
          can_id: 0x35E
          data: [0x50, 0x59, 0x4C, 0x4F, 0x4E, 0x20, 0x20, 0x20]
