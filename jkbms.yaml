esphome:
  name: jkbms-senergy
  friendly_name: JK BMS & Senergy 4kW

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "JKBMS-Senergy-Fallback"
    password: "password1234"

captive_portal:

# Giao diện web trực tiếp trên trình duyệt (http://jkbms-senergy.local)
web_server:
  port: 80
  version: 3
  local: true

logger:
  baud_rate: 0 # Tắt log qua UART0 nếu dùng chân TX0/RX0 cho RS485

api:
ota:
  - platform: esphome

# Thư viện giao tiếp JK BMS của syssi
external_components:
  - source: github://syssi/esphome-jk-bms@main
    refresh: 0s

# 1. KẾT NỐI BLUETOOTH VỚI JK BMS
esp32_ble_tracker:
  scan_parameters:
    active: true

ble_client:
  - mac_address: C8:47:8C:10:79:7A
    id: client0

jk_bms_ble:
  - ble_client_id: client0
    id: bms0
    protocol_version: JK02_32S # Đổi thành JK02_24S nếu BMS bản cũ 24S
    throttle: 2s

# 2. KẾT NỐI RS485 MODBUS VỚI BIẾN TẦN SENERGY 4KW
uart:
  - id: mod_bus_uart
    tx_pin: GPIO17 # Chân TX nối sang module RS485 (kiểm tra lại chân thực tế bạn đấu)
    rx_pin: GPIO16 # Chân RX nối sang module RS485
    baud_rate: 9600
    stop_bits: 1

modbus:
  id: modbus1
  uart_id: mod_bus_uart
  send_wait_time: 200ms

modbus_controller:
  - id: senergy
    address: 0x01
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 5s

# 3. CÁC CẢM BIẾN HIỂN THỊ (ÁP, DÒNG, DUNG LƯỢNG ĐẦY, CELL & SENERGY)
sensor:
  # --- Thông số toàn khối JK BMS ---
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      name: "Pin - Dien Ap Tong (V)"
    current:
      name: "Pin - Dong Sac Xa (A)"
    power:
      name: "Pin - Cong Suat (W)"
    charging_power:
      name: "Pin - Cong Suat Sac (W)"
    discharging_power:
      name: "Pin - Cong Suat Xa (W)"
    state_of_charge:
      name: "Pin - Phan Tram Pin (%)"
    capacity_remaining:
      name: "Pin - Dung Luong Con Lai (Ah)"
    full_charge_capacity:
      name: "Pin - Dung Luong Day (Ah)"
    total_battery_capacity_setting:
      name: "Pin - Dung Luong Cai Dat (Ah)"
    temperature_sensor_1:
      name: "Pin - Nhiet Do 1"
    temperature_sensor_2:
      name: "Pin - Nhiet Do 2"
    power_tube_temperature:
      name: "Pin - Nhiet Do MOS"
    min_cell_voltage:
      name: "Pin - Min Cell Voltage"
    max_cell_voltage:
      name: "Pin - Max Cell Voltage"
    delta_cell_voltage:
      name: "Pin - Lech Ap Cell (V)"
    # Điện áp 8 cell (hệ 24V)
    cell_voltage_1:
      name: "Cell 01"
    cell_voltage_2:
      name: "Cell 02"
    cell_voltage_3:
      name: "Cell 03"
    cell_voltage_4:
      name: "Cell 04"
    cell_voltage_5:
      name: "Cell 05"
    cell_voltage_6:
      name: "Cell 06"
    cell_voltage_7:
      name: "Cell 07"
    cell_voltage_8:
      name: "Cell 08"

  # --- Thông số biến tần Senergy 4kW (Thanh ghi Input) ---
  - platform: modbus_controller
    modbus_controller_id: senergy
    name: "Senergy - Dien Ap Luoi (V)"
    register_type: read
    address: 0x1001
    unit_of_measurement: "V"
    value_type: U_WORD
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: senergy
    name: "Senergy - Cong Suat Luoi (W)"
    register_type: read
    address: 0x1005
    unit_of_measurement: "W"
    value_type: S_DWORD

  - platform: modbus_controller
    modbus_controller_id: senergy
    name: "Senergy - Cong Suat PV1 (W)"
    register_type: read
    address: 0x1013
    unit_of_measurement: "W"
    value_type: U_DWORD

  - platform: modbus_controller
    modbus_controller_id: senergy
    name: "Senergy - Cong Suat PV2 (W)"
    register_type: read
    address: 0x1017
    unit_of_measurement: "W"
    value_type: U_DWORD

  - platform: modbus_controller
    modbus_controller_id: senergy
    name: "Senergy - Cong Suat Tai (W)"
    register_type: read
    address: 0x100D
    unit_of_measurement: "W"
    value_type: U_DWORD

# 4. CÔNG TẮC ĐIỀU KHIỂN (BẬT/TẮT SẠC, XẢ, ĐẨY LƯỚI)
switch:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    charging:
      name: "Pin - Cong Tac Sac"
    discharging:
      name: "Pin - Cong Tac Xa"
    balancer:
      name: "Pin - Can Bang Chu Dong"

  - platform: modbus_controller
    modbus_controller_id: senergy
    name: "Senergy - Cho Phep Day Luoi"
    register_type: holding
    address: 0x2014
    bitmask: 1

# 5. THANH TRƯỢT CÀI ĐẶT (DÒNG SẠC, SOC CẮT XẢ, CÔNG SUẤT ĐẨY LƯỚI)
number:
  - platform: modbus_controller
    modbus_controller_id: senergy
    name: "Senergy - Cong Suat Day Luoi (W)"
    id: senergy_feed_in_power
    register_type: holding
    address: 0x2015
    value_type: U_WORD
    min_value: 0
    max_value: 4000
    step: 100
    unit_of_measurement: "W"
    mode: slider

  - platform: modbus_controller
    modbus_controller_id: senergy
    name: "Senergy - Gioi Han Dong Sac (A)"
    id: senergy_max_charge_current
    register_type: holding
    address: 0x2005
    value_type: U_WORD
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "A"
    filters:
      - multiply: 10
    mode: slider

  - platform: modbus_controller
    modbus_controller_id: senergy
    name: "Senergy - SOC Cat Xa Toi Thieu (%)"
    id: senergy_min_soc
    register_type: holding
    address: 0x2008
    value_type: U_WORD
    min_value: 10
    max_value: 90
    step: 5
    unit_of_measurement: "%"
    mode: slider
