  jk_bms_mac: "C8:47:8C:10:79:7A"
  blynk_token: "YApwHwb_atq5PAiQzC-0qHsb74EPLW6e"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

# Kết nối Wi-Fi chính + 2 Wi-Fi dự phòng (Tự động chuyển đổi khi rớt mạng)
wifi:
  networks:
    - ssid: "TUAN BIEN"
      password: "76767676"
      priority: 10
      manual_ip:
        static_ip: 192.168.10.200
        gateway: 192.168.10.1
        subnet: 255.255.255.0

    - ssid: "VUNGO"
      password: "1234567890"
      priority: 5

    - ssid: "Quang Tho"
      password: "12345678"
      priority: 3

  # Phát Wi-Fi dự phòng nội bộ từ chính ESP32 nếu cả 3 mạng trên đều mất
  ap:
    ssid: "JKBMS-Senergy-Backup"
    password: "12345678"

# Đồng bộ giờ chuẩn Việt Nam để chạy 4 khung giờ xả tùy chọn
time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Ho_Chi_Minh
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lambda: |-
              auto now = id(sntp_time).now();
              if (!now.is_valid()) return;
              int cur_mins = now.hour * 60 + now.minute;
              
              auto in_range = [&](int sh, int sm, int eh, int em) {
                int start = sh * 60 + sm;
                int end = eh * 60 + em;
                if (start <= end) return (cur_mins >= start && cur_mins < end);
                else return (cur_mins >= start || cur_mins < end);
              };

              bool active = false;
              if (id(slot1_enable).state && in_range(id(s1_start_h).state, id(s1_start_m).state, id(s1_end_h).state, id(s1_end_m).state)) active = true;
              if (id(slot2_enable).state && in_range(id(s2_start_h).state, id(s2_start_m).state, id(s2_end_h).state, id(s2_end_m).state)) active = true;
              if (id(slot3_enable).state && in_range(id(s3_start_h).state, id(s3_start_m).state, id(s3_end_h).state, id(s3_end_m).state)) active = true;
              if (id(slot4_enable).state && in_range(id(s4_start_h).state, id(s4_start_m).state, id(s4_end_h).state, id(s4_end_m).state)) active = true;

              if (id(discharge_master).state != active) {
                if (active) id(discharge_master).turn_on();
                else id(discharge_master).turn_off();
              }

# Web nội bộ (Hỗ trợ giao diện Sáng/Tối Day-Night, biểu tượng Mặt trời & Nạp OTA)
web_server:
  port: 80
  version: 3
  local: true

ota:
  platform: esphome

# Gửi dữ liệu lên Blynk Cloud xem qua 4G (mỗi 10 giây)
http_request:
  useragent: esphome/device
  timeout: 5s

interval:
  - interval: 10s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                url: !lambda |-
                  char buf[256];
                  snprintf(buf, sizeof(buf),
                    "http://blynk.cloud",
                    "${blynk_token}",
                    isnan(id(total_voltage).state) ? 0.0 : id(total_voltage).state,
                    isnan(id(current).state) ? 0.0 : id(current).state,
                    isnan(id(state_of_charge).state) ? 0.0 : id(state_of_charge).state,
                    isnan(id(pv_power).state) ? 0.0 : id(pv_power).state,
                    isnan(id(grid_power).state) ? 0.0 : id(grid_power).state,
                    isnan(id(load_power).state) ? 0.0 : id(load_power).state,
                    isnan(id(bat_power).state) ? 0.0 : id(bat_power).state,
                    id(discharge_master).state ? 1 : 0
                  );
                  return std::string(buf);

# Module 1: Đọc JK-BMS qua Bluetooth
esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main
  - source: github://syssi/esphome-jk-bms-can@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 2s
    id: bms0

# Module 2: Giao tiếp CAN Pylontech sang Senergy 4kW (D4, D5)
canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

jk_bms_can:
  - jk_bms_ble_id: bms0
    canbus_id: can_bus
    protocol: PYLON
    update_interval: 1s
    charge_voltage: 28.4V
    charge_current_limit: 70A
    discharge_current_limit: 75A
    discharge_voltage: 25.0V

# Module 3: Đọc RS485 Modbus từ biến tần Senergy 4kW (D16, D17)
uart:
  id: modbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

modbus:
  id: senergy_modbus
  uart_id: modbus_uart

modbus_controller:
  - id: senergy_inv
    address: 0x01
    modbus_id: senergy_modbus
    update_interval: 5s

# Chân kích xung bật/tắt nguồn JK-BMS (GPIO14 nối qua Opto/Rơ-le vào chân kích BMS)
output:
  - platform: gpio
    pin: GPIO14
    id: bms_pwr_pulse

button:
  - platform: template
    name: "🔄 Kich bat / Tat nguon JK-BMS"
    id: btn_toggle_bms
    on_press:
      - output.turn_on: bms_pwr_pulse
      - delay: 2500ms
      - output.turn_off: bms_pwr_pulse

# Công tắc điều khiển Xả Pin & 4 Lịch xả tùy chọn
switch:
  - platform: template
    name: "☀️ Cho phep Xa Pin (Tong)"
    id: discharge_master
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "⏰ Lich xa 1"
    id: slot1_enable
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "⏰ Lich xa 2"
    id: slot2_enable
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "⏰ Lich xa 3"
    id: slot3_enable
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "⏰ Lich xa 4"
    id: slot4_enable
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# Công tắc cơ vật lý đấu chân D13 (GPIO13) và GND để kích bật/tắt BMS bằng tay
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13
      mode: INPUT_PULLUP
      inverted: true
    name: "Cong tac co kich BMS"
    filters:
      - delayed_on: 50ms
    on_press:
      - button.press: btn_toggle_bms

# Thanh trượt cài đặt dòng áp & 4 Lịch giờ/phút tùy chỉnh
