substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"
  blynk_token: "YApwHwb_atq5PAiQzC-0qHsb74EPLW6e"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: WARN

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"
  reboot_timeout: 0s
  manual_ip:
    static_ip: 192.168.1.200
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
    dns2: 1.1.1.1
  ap:
    ssid: "JK-BMS-Fallback"
    password: "12345678"

captive_portal:
web_server:
  port: 80
  version: 2
http_request:
  useragent: esphome/device
  timeout: 5s
  verify_ssl: false
ota:
  platform: esphome

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 3s
    id: bms0

canbus:
  - platform: esp32_can
    id: can_bus
    can_id: 4
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO25
      mode: { input: true, pullup: true }
      inverted: true
    name: "Nut Nhan Co Bat Tat BMS"
    filters: [{ delayed_on: 50ms }]
    on_press:
      then:
        - if:
            condition:
              or: [{ switch.is_on: bms_charge_sw }, { switch.is_on: bms_discharge_sw }]
            then:
              - switch.turn_off: bms_charge_sw
              - switch.turn_off: bms_discharge_sw
            else:
              - switch.turn_on: bms_charge_sw
              - switch.turn_on: bms_discharge_sw

interval:
  - interval: 1s
    then:
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x351
          data: !lambda |-
            uint16_t cv = (uint16_t)(id(can_charge_v).state * 10);
            uint16_t ci = (uint16_t)(id(can_charge_i).state * 10);
            uint16_t di = (uint16_t)(id(can_discharge_i).state * 10);
            uint16_t dv = (uint16_t)(id(can_discharge_v).state * 10);
            return {(uint8_t)(cv & 0xFF), (uint8_t)(cv >> 8), (uint8_t)(ci & 0xFF), (uint8_t)(ci >> 8), (uint8_t)(di & 0xFF), (uint8_t)(di >> 8), (uint8_t)(dv & 0xFF), (uint8_t)(dv >> 8)};
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x355
          data: !lambda |-
            uint16_t soc = isnan(id(state_of_charge).state) ? 50 : (uint16_t)id(state_of_charge).state;
            return {(uint8_t)(soc & 0xFF), (uint8_t)(soc >> 8), 100, 0, 0, 0, 0, 0};
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x356
          data: !lambda |-
            int16_t v = isnan(id(total_voltage).state) ? 2640 : (int16_t)(id(total_voltage).state * 100);
            int16_t i = isnan(id(current).state) ? 0 : (int16_t)(id(current).state * 10);
            int16_t t = isnan(id(temp_1).state) ? 250 : (int16_t)(id(temp_1).state * 10);
            return {(uint8_t)(v & 0xFF), (uint8_t)(v >> 8), (uint8_t)(i & 0xFF), (uint8_t)(i >> 8), (uint8_t)(t & 0xFF), (uint8_t)(t >> 8), 0, 0};
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x35C
          data: !lambda |-
            return {0xC0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00};
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x35E
          data: !lambda |-
            return {0x50, 0x59, 0x4C, 0x4F, 0x4E, 0x20, 0x20, 0x20};

  - interval: 5s
    then:
      - if:
          condition: wifi.connected
          then:
            - http_request.get:
                url: !lambda |-
                  std::string u = "https://blynk.cloud{blynk_token}";
                  u += "&V0=" + to_string((int)(isnan(id(state_of_charge).state) ? 0 : id(state_of_charge).state));
                  u += "&V1=" + str_sprintf("%.2f", isnan(id(total_voltage).state) ? 0.0f : id(total_voltage).state);
                  u += "&V2=" + str_sprintf("%.1f", isnan(id(current).state) ? 0.0f : id(current).state);
                  u += "&V3=" + to_string((int)(isnan(id(pv1_power).state) ? 0 : id(pv1_power).state));
                  u += "&V4=" + to_string((int)(isnan(id(load_power).state) ? 0 : id(load_power).state));
                  u += "&V7=" + str_sprintf("%.1f", isnan(id(grid_voltage).state) ? 0.0f : id(grid_voltage).state);
                  u += "&V8=" + str_sprintf("%.1f", isnan(id(mos_temp).state) ? 0.0f : id(mos_temp).state);
                  u += "&V9=" + str_sprintf("%.1f", isnan(id(temp_1).state) ? 0.0f : id(temp_1).state);
                  u += "&V10=" + str_sprintf("%.3f", isnan(id(delta_cell_v).state) ? 0.0f : id(delta_cell_v).state);
                  u += "&V19=" + str_sprintf("%.1f", isnan(id(rem_capacity).state) ? 0.0f : id(rem_capacity).state);
                  return u;

  - interval: 8s
    then:
      - if:
          condition: wifi.connected
          then:
            - http_request.get:
                url: !lambda |-
                  std::string u = "https://blynk.cloud{blynk_token}";
                  u += "&V11=" + str_sprintf("%.3f", isnan(id(cell_1).state) ? 0.0f : id(cell_1).state);
                  u += "&V12=" + str_sprintf("%.3f", isnan(id(cell_2).state) ? 0.0f : id(cell_2).state);
                  u += "&V13=" + str_sprintf("%.3f", isnan(id(cell_3).state) ? 0.0f : id(cell_3).state);
                  u += "&V14=" + str_sprintf("%.3f", isnan(id(cell_4).state) ? 0.0f : id(cell_4).state);
                  u += "&V15=" + str_sprintf("%.3f", isnan(id(cell_5).state) ? 0.0f : id(cell_5).state);
                  u += "&V16=" + str_sprintf("%.3f", isnan(id(cell_6).state) ? 0.0f : id(cell_6).state);
                  u += "&V17=" + str_sprintf("%.3f", isnan(id(cell_7).state) ? 0.0f : id(cell_7).state);
                  u += "&V18=" + str_sprintf("%.3f", isnan(id(cell_8).state) ? 0.0f : id(cell_8).state);
  - interval: 6s
    then:
      - if:
          condition: wifi.connected
          then:
            - http_request.get:
                url: "https://blynk.cloud{blynk_token}&V6"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          float val = atof(body.c_str());
                          if (val >= 0 && val <= 4000 && val != id(senergy_export_limit).state) {
                            auto call = id(senergy_export_limit).make_call(); call.set_value(val); call.perform();
                          }
                        }
            - http_request.get:
                url: "https://blynk.cloud{blynk_token}&V5"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          int sw = atoi(body.c_str());
                          if (sw == 1 && !id(senergy_export_sw).state) id(senergy_export_sw).turn_on();
                          else if (sw == 0 && id(senergy_export_sw).state) id(senergy_export_sw).turn_off();
                        }

  - interval: 7s
    then:
      - if:
          condition: wifi.connected
          then:
            - http_request.get:
                url: "https://blynk.cloud{blynk_token}&V22"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          float val = atof(body.c_str());
                          if (val >= 25.0 && val <= 29.2 && fabs(val - id(can_charge_v).state) > 0.05) {
                            auto call = id(can_charge_v).make_call(); call.set_value(val); call.perform();
                          }
                        }
            - http_request.get:
                url: "https://blynk.cloud{blynk_token}&V23"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          float val = atof(body.c_str());
                          if (val >= 0 && val <= 100 && val != id(can_charge_i).state) {
                            auto call = id(can_charge_i).make_call(); call.set_value(val); call.perform();
                          }
                        }
            - http_request.get:
                url: "https://blynk.cloud{blynk_token}&V24"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          float val = atof(body.c_str());
                          if (val >= 0 && val <= 150 && val != id(can_discharge_i).state) {
                            auto call = id(can_discharge_i).make_call(); call.set_value(val); call.perform();
                          }
                        }

uart:
  - { id: uart_rs485, tx_pin: GPIO17, rx_pin: GPIO16, baud_rate: 9600 }
modbus:
  - { id: modbus_senergy, uart_id: uart_rs485 }
modbus_controller:
  - { id: senergy_inv, address: 0x01, modbus_id: modbus_senergy, update_interval: 5s }

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage: { name: "Pin - Total Voltage", id: total_voltage }
    current: { name: "Pin - Current", id: current }
    power: { name: "Pin - Power" }
    state_of_charge: { name: "Pin - State of Charge", id: state_of_charge }
    capacity_remaining: { name: "Pin - Dung Luong Con Lai (Ah)", id: rem_capacity }
    mosfet_temperature: { name: "Pin - Nhiet Do MOS", id: mos_temp }
    temperature_sensor_1: { name: "Pin - Temperature 1", id: temp_1 }
    min_cell_voltage: { name: "Pin - Min Cell Voltage" }
    max_cell_voltage: { name: "Pin - Max Cell Voltage" }
    delta_cell_voltage: { name: "Pin - Delta Cell Voltage", id: delta_cell_v }
    cell_voltage_1: { name: "Pin - Cell 1 Voltage", id: cell_1 }
    cell_voltage_2: { name: "Pin - Cell 2 Voltage", id: cell_2 }
    cell_voltage_3: { name: "Pin - Cell 3 Voltage", id: cell_3 }
    cell_voltage_4: { name: "Pin - Cell 4 Voltage", id: cell_4 }
    cell_voltage_5: { name: "Pin - Cell 5 Voltage", id: cell_5 }
    cell_voltage_6: { name: "Pin - Cell 6 Voltage", id: cell_6 }
    cell_voltage_7: { name: "Pin - Cell 7 Voltage", id: cell_7 }
    cell_voltage_8: { name: "Pin - Cell 8 Voltage", id: cell_8 }
  - { platform: modbus_controller, modbus_controller_id: senergy_inv, name: "Senergy - Dien Ap Luoi (V)", id: grid_voltage, address: 0x1000, register_type: read, value_type: U_WORD, accuracy_decimals: 1, filters: [{ multiply: 0.1 }], unit_of_measurement: "V" }
  - { platform: modbus_controller, modbus_controller_id: senergy_inv, name: "Senergy - Cong Suat PV1 (W)", id: pv1_power, address: 0x100A, register_type: read, value_type: U_WORD, unit_of_measurement: "W" }
  - { platform: modbus_controller, modbus_controller_id: senergy_inv, name: "Senergy - Cong Suat Tai (W)", id: load_power, address: 0x1018, register_type: read, value_type: S_WORD, unit_of_measurement: "W" }

switch:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    charging: { name: "Pin - Cong Tac Sac BMS", id: bms_charge_sw }
    discharging: { name: "Pin - Cong Tac Xa BMS", id: bms_discharge_sw }
    balancer: { name: "Pin - Can Bang Cell" }
  - { platform: modbus_controller, modbus_controller_id: senergy_inv, name: "Senergy - Cho Phep Day Luoi", id: senergy_export_sw, address: 0x2014, register_type: holding, bitmask: 1 }

number:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_battery_capacity: { name: "Pin - Dung Luong (Ah)" }
    max_charge_current: { name: "Pin - Dong Sac Toi Da BMS (A)" }
    max_discharge_current: { name: "Pin - Dong Xa Toi Da BMS (A)" }
  - { platform: template, name: "CAN - Dien Ap Sac (V)", id: can_charge_v, optimistic: true, min_value: 25.0, max_value: 29.2, step: 0.1, initial_value: 28.4, restore_value: true }
  - { platform: template, name: "CAN - Dien Ap Xa (V)", id: can_discharge_v, optimistic: true, min_value: 22.0, max_value: 26.5, step: 0.1, initial_value: 25.2, restore_value: true }
  - { platform: template, name: "CAN - Dong Sac Toi Da (A)", id: can_charge_i, optimistic: true, min_value: 0, max_value: 100, step: 1, initial_value: 60, restore_value: true }
  - { platform: template, name: "CAN - Dong Xa Toi Da (A)", id: can_discharge_i, optimistic: true, min_value: 0, max_value: 150, step: 1, initial_value: 75, restore_value: true }
  - { platform: modbus_controller, modbus_controller_id: senergy_inv, name: "Senergy - Cong Suat Day Luoi (W)", id: senergy_export_limit, address: 0x2015, register_type: holding, value_type: U_WORD, min_value: 0, max_value: 4000, step: 50, unit_of_measurement: "W" }
     return u;
