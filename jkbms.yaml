substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: WARN

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"
  manual_ip:
    static_ip: 192.168.1.200
    gateway: 192.168.1.1
    subnet: 255.255.255.0

web_server:
  port: 80
  version: 3

mqtt:
  broker: "://hivemq.com"
  port: 1883
  topic_prefix: "tuanbien_senergy_jkbms"

ota:
  platform: esphome

# ==========================================
# 1. BLUETOOTH JK BMS
# ==========================================
esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 3s
    id: bms0

# ==========================================
# 2. CỔNG CAN PYLONTECH GỬI SENERGY 4KW
# ==========================================
canbus:
  - platform: esp32_can
    id: can_bus
    can_id: 4
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

interval:
  - interval: 1s
    then:
      # Gói 0x351: Giới hạn Áp/Dòng Sạc & Xả
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x351
          data: !lambda |-
            uint16_t cv = (uint16_t)(id(can_charge_v).state * 10);
            uint16_t ci = (uint16_t)(id(can_charge_i).state * 10);
            uint16_t di = (uint16_t)(id(can_discharge_i).state * 10);
            uint16_t dv = (uint16_t)(id(can_discharge_v).state * 10);
            return {
              (uint8_t)(cv & 0xFF), (uint8_t)(cv >> 8),
              (uint8_t)(ci & 0xFF), (uint8_t)(ci >> 8),
              (uint8_t)(di & 0xFF), (uint8_t)(di >> 8),
              (uint8_t)(dv & 0xFF), (uint8_t)(dv >> 8)
            };
      # Gói 0x355: SOC (%) & SOH (%)
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x355
          data: !lambda |-
            uint16_t soc = isnan(id(state_of_charge).state) ? 50 : (uint16_t)id(state_of_charge).state;
            uint16_t soh = 100;
            return {
              (uint8_t)(soc & 0xFF), (uint8_t)(soc >> 8),
              (uint8_t)(soh & 0xFF), (uint8_t)(soh >> 8),
              0x00, 0x00, 0x00, 0x00
            };
      # Gói 0x356: Điện áp thực tế, Dòng điện thực tế, Nhiệt độ
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x356
          data: !lambda |-
            int16_t v = isnan(id(total_voltage).state) ? 2640 : (int16_t)(id(total_voltage).state * 100);
            int16_t i = isnan(id(current).state) ? 0 : (int16_t)(id(current).state * 10);
            int16_t t = isnan(id(temp_1).state) ? 250 : (int16_t)(id(temp_1).state * 10);
            return {
              (uint8_t)(v & 0xFF), (uint8_t)(v >> 8),
              (uint8_t)(i & 0xFF), (uint8_t)(i >> 8),
              (uint8_t)(t & 0xFF), (uint8_t)(t >> 8),
              0x00, 0x00
            };
      # Gói 0x35C: Cho phép Sạc & Xả
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x35C
          data: [0xC0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      # Gói 0x35E: Tên giao thức PYLON
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x35E
          data: [0x50, 0x59, 0x4C, 0x4F, 0x4E, 0x20, 0x20, 0x20]

# ==========================================
# 3. GIAO TIẾP RS485 VỚI BIẾN TẦN SENERGY
# ==========================================
uart:
  - id: uart_rs485
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600

modbus:
  - id: modbus_senergy
    uart_id: uart_rs485

modbus_controller:
  - id: senergy_inv
    address: 0x01
    modbus_id: modbus_senergy
    update_interval: 5s

# ==========================================
# 4. CẢM BIẾN HIỂN THỊ (JK BMS + SENERGY)
# ==========================================
sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      name: "Pin - Total Voltage"
      id: total_voltage
    current:
      name: "Pin - Current"
      id: current
    power:
      name: "Pin - Power"
    state_of_charge:
      name: "Pin - State of Charge"
      id: state_of_charge
    power_tube_temperature:
      name: "Pin - Nhiet Do MOS"
    temperature_sensor_1:
      name: "Pin - Temperature 1"
      id: temp_1
    temperature_sensor_2:
      name: "Pin - Temperature 2"
    min_cell_voltage:
      name: "Pin - Min Cell Voltage"
    max_cell_voltage:
      name: "Pin - Max Cell Voltage"
    delta_cell_voltage:
      name: "Pin - Delta Cell Voltage"
    cell_voltage_1:
      name: "Pin - Cell 1 Voltage"
    cell_voltage_2:
      name: "Pin - Cell 2 Voltage"
    cell_voltage_3:
      name: "Pin - Cell 3 Voltage"
    cell_voltage_4:
      name: "Pin - Cell 4 Voltage"
    cell_voltage_5:
      name: "Pin - Cell 5 Voltage"
    cell_voltage_6:
      name: "Pin - Cell 6 Voltage"
    cell_voltage_7:
      name: "Pin - Cell 7 Voltage"
    cell_voltage_8:
      name: "Pin - Cell 8 Voltage"

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - Dien Ap Luoi (V)"
    address: 0x1000
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - Cong Suat PV1 (W)"
    address: 0x100A
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "W"

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - Cong Suat PV2 (W)"
    address: 0x100D
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "W"

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - Cong Suat Tai (W)"
    address: 0x1018
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "W"

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - Cong Suat Luoi (W)"
    address: 0x1016
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "W"

# ==========================================
# 5. CÔNG TẮC BẬT/TẮT
# ==========================================
switch:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    charging:
      name: "Pin - Cong Tac Sac BMS"
    discharging:
      name: "Pin - Cong Tac Xa BMS"
    balancer:
      name: "Pin - Can Bang Cell"

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - Cho Phep Day Luoi"
    address: 0x2014
    register_type: holding
    bitmask: 1

# ==========================================
# 6. THANH TRƯỢT ĐIỀU CHỈNH (CAN + SENERGY PV)
# ==========================================
number:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    battery_capacity:
      name: "Pin - Dung Luong (Ah)"
    cell_count:
      name: "Pin - So Cell"

  - platform: template
    name: "CAN - Ap Sac Toi Da (V)"
    id: can_charge_v
    optimistic: true
    restore_value: true
    initial_value: 28.4
    min_value: 24.0
    max_value: 30.0
    step: 0.1
    unit_of_measurement: "V"
    mode: slider

  - platform: template
    name: "CAN - Ap Cat Xa (V)"
    id: can_discharge_v
    optimistic: true
    restore_value: true
    initial_value: 25.0
    min_value: 20.0
    max_value: 26.0
    step: 0.1
    unit_of_measurement: "V"
    mode: slider

  - platform: template
    name: "CAN - Dong Sac Toi Da (A)"
    id: can_charge_i
    optimistic: true
    restore_value: true
    initial_value: 70
    min_value: 1
    max_value: 150
    step: 1
    unit_of_measurement: "A"
    mode: slider

  - platform: template
    name: "CAN - Dong Xa Toi Da (A)"
    id: can_discharge_i
    optimistic: true
    restore_value: true
    initial_value: 75
    min_value: 1
    max_value: 150
    step: 1
    unit_of_measurement: "A"
    mode: slider

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - Cong Suat Day Luoi PV (W)"
    address: 0x2015
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 4000
    step: 100
    unit_of_measurement: "W"
    mode: slider

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - Gioi Han Dong Sac (A)"
    address: 0x2016
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 120
    step: 5
    unit_of_measurement: "A"
    mode: slider

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - SOC Cat Xa Toi Thieu (%)"
    address: 0x2017
    register_type: holding
    value_type: U_WORD
    min_value: 5
    max_value: 90
    step: 5
    unit_of_measurement: "%"
    mode: slider
