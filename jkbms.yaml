substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: WARN # Giảm log để tiết kiệm RAM cho ESP32

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"
  manual_ip:
    static_ip: 192.168.1.200
    gateway: 192.168.1.1
    subnet: 255.255.255.0

# Giao diện Web nội bộ (mở tại http://192.168.1.200)
web_server:
  port: 80
  version: 3

# Kết nối MQTT từ xa (nhẹ RAM, xem và chỉnh qua app IoT MQTT Panel bằng 4G)
mqtt:
  broker: "://hivemq.com"
  port: 1883
  topic_prefix: "tuanbien_senergy_jkbms"

ota:
  platform: esphome

# ==========================================
# 1. KẾT NỐI BLUETOOTH VỚI JK BMS
# ==========================================
esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main
  - source: github://syssi/esphome-jk-bms-can@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 3s
    id: bms0

# ==========================================
# 2. GIAO TIẾP CAN SANG BIẾN TẦN SENERGY 4KW
# ==========================================
canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

jk_bms_can:
  - jk_bms_ble_id: bms0
    canbus_id: can_bus
    protocol: PYLON
    update_interval: 1s
    charge_voltage: 28.4V
    charge_current_limit: 70A
    discharge_current_limit: 75A
    discharge_voltage: 25.0V

# ==========================================
# 3. GIAO TIẾP MODBUS RS485 VỚI BIẾN TẦN SENERGY
# ==========================================
uart:
  - id: uart_rs485
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600

modbus:
  - id: modbus_senergy
    uart_id: uart_rs485

modbus_controller:
  - id: senergy_inv
    address: 0x01
    modbus_id: modbus_senergy
    update_interval: 5s

# ==========================================
# 4. CÁC CẢM BIẾN HIỂN THỊ (PIN + BIẾN TẦN)
# ==========================================
sensor:
  # --- Thông số JK BMS ---
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      name: "Pin - Total Voltage"
      id: total_voltage
    current:
      name: "Pin - Current"
      id: current
    power:
      name: "Pin - Power"
    state_of_charge:
      name: "Pin - State of Charge"
      id: state_of_charge
    power_tube_temperature:
      name: "Pin - Nhiet Do MOS"
      id: mos_temp
    temperature_sensor_1:
      name: "Pin - Temperature 1"
      id: temp_1
    temperature_sensor_2:
      name: "Pin - Temperature 2"
    min_cell_voltage:
      name: "Pin - Min Cell Voltage"
      id: min_cell_voltage
    max_cell_voltage:
      name: "Pin - Max Cell Voltage"
      id: max_cell_voltage
    delta_cell_voltage:
      name: "Pin - Delta Cell Voltage"
    cell_voltage_1:
      name: "Pin - Cell 1 Voltage"
    cell_voltage_2:
      name: "Pin - Cell 2 Voltage"
    cell_voltage_3:
      name: "Pin - Cell 3 Voltage"
    cell_voltage_4:
      name: "Pin - Cell 4 Voltage"
    cell_voltage_5:
      name: "Pin - Cell 5 Voltage"
    cell_voltage_6:
      name: "Pin - Cell 6 Voltage"
    cell_voltage_7:
      name: "Pin - Cell 7 Voltage"
    cell_voltage_8:
      name: "Pin - Cell 8 Voltage"

  # --- Thông số Biến tần Senergy (Đọc qua RS485) ---
  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - Dien Ap Luoi (V)"
    address: 0x1000
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - Cong Suat PV1 (W)"
    address: 0x100A
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "W"

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - Cong Suat PV2 (W)"
    address: 0x100D
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "W"

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - Cong Suat Tai (W)"
    address: 0x1018
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "W"

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - Cong Suat Luoi (W)"
    address: 0x1016
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "W"

# ==========================================
# 5. CÔNG TẮC BẬT/TẮT (BMS + ĐẨY LƯỚI SENERGY)
# ==========================================
switch:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    charging:
      name: "Pin - Cong Tac Sac BMS"
    discharging:
      name: "Pin - Cong Tac Xa BMS"
    balancer:
      name: "Pin - Can Bang Cell"

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - Cho Phep Day Luoi"
    address: 0x2014
    register_type: holding
    bitmask: 1

# ==========================================
# 6. THANH TRƯỢT ĐIỀU CHỈNH (CAN + SENERGY PV)
# ==========================================
number:
  # --- Thanh chỉnh thông số BMS ---
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    battery_capacity:
      name: "Pin - Dung Luong (Ah)"
    cell_count:
      name: "Pin - So Cell"

  # --- Thanh chỉnh thông số CAN gửi biến tần ---
  - platform: jk_bms_can
    jk_bms_can_id: jk_bms_can_id
    charge_voltage:
      name: "CAN - Ap Sac Toi Da (V)"
    discharge_voltage:
      name: "CAN - Ap Cat Xa (V)"
    charge_current_limit:
      name: "CAN - Dong Sac Toi Da (A)"
    discharge_current_limit:
      name: "CAN - Dong Xa Toi Da (A)"

  # --- Thanh chỉnh Biến tần Senergy qua RS485 ---
  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - Cong Suat Day Luoi PV (W)"
    address: 0x2015
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 4000
    step: 100
    unit_of_measurement: "W"
    mode: slider

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - Gioi Han Dong Sac (A)"
    address: 0x2016
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 120
    step: 5
    unit_of_measurement: "A"
    mode: slider

  - platform: modbus_controller
    modbus_controller_id: senergy_inv
    name: "Senergy - SOC Cat Xa Toi Thieu (%)"
    address: 0x2017
    register_type: holding
    value_type: U_WORD
    min_value: 5
    max_value: 90
    step: 5
    unit_of_measurement: "%"
    mode: slider
