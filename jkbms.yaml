substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"
  ap:
    ssid: "JK-BMS-Config"
    password: "12345678"

captive_portal:

ota:
  - platform: esphome
  - platform: web_server

web_server:
  port: 80

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 2s
    id: bms0

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      name: "Battery Voltage"
      id: total_voltage
    current:
      name: "Battery Current"
      id: current
    state_of_charge:
      name: "Battery SoC"
      id: state_of_charge
    power_tube_temperature:
      name: "MOS Temperature"
      id: mos_temp
    temperature_sensor_1:
      name: "Battery Temp 1"
      id: temp_1
    min_cell_voltage:
      name: "Min Cell Voltage"
      id: min_cell_voltage
    max_cell_voltage:
      name: "Max Cell Voltage"
      id: max_cell_voltage

canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO4
    rx_pin: GPIO5
    can_id: 0x351
    bit_rate: 500kbps

interval:
  - interval: 1s
    then:
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x351
          data: [0x1C, 0x01, 0xBC, 0x02, 0xEE, 0x02, 0xFA, 0x00]
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x355
          data: !lambda |-
            uint16_t soc = isnan(id(state_of_charge).state) ? 50 : (uint16_t)id(state_of_charge).state;
            return {(uint8_t)(soc & 0xFF), (uint8_t)(soc >> 8), 0x64, 0x00, 0x00, 0x00, 0x00, 0x00};
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x356
          data: !lambda |-
            int16_t v = isnan(id(total_voltage).state) ? 2640 : (int16_t)(id(total_voltage).state * 100);
            int16_t c = isnan(id(current).state) ? 0 : (int16_t)(id(current).state * 10);
            int16_t t = isnan(id(temp_1).state) ? 250 : (int16_t)(id(temp_1).state * 10);
            return {(uint8_t)(v & 0xFF), (uint8_t)(v >> 8), (uint8_t)(c & 0xFF), (uint8_t)(c >> 8), (uint8_t)(t & 0xFF), (uint8_t)(t >> 8), 0x00, 0x00};
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x359
          data: [0x00, 0x00, 0x00, 0x00, 0x01, 0x50, 0x4E, 0x00]
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x35C
          data: [0xC0, 0x00]
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x35E
          data: [0x50, 0x59, 0x4C, 0x4F, 0x4E, 0x20, 0x20, 0x20]
