substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"
  blynk_token: "YApwHwb_atq5PAiQzC-0qHsb74EPLW6e"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"
  ap:
    ssid: "JK-BMS-Fallback"
    password: "12345678"

captive_portal:

# Giao diện Web ổn định (Version 2: có chế độ ngày/đêm, nạp OTA trực tiếp)
web_server:
  port: 80
  version: 2

ota:
  platform: esphome

http_request:
  verify_ssl: false

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 2s
    id: bms0

canbus:
  - platform: esp32_can
    id: can_bus
    can_id: 1
    tx_pin: GPIO16
    rx_pin: GPIO17
    bit_rate: 500kbps

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      name: "Battery Voltage"
      id: total_voltage
    current:
      name: "Battery Current"
      id: current
    state_of_charge:
      name: "Battery SoC"
      id: state_of_charge
    power_tube_temperature:
      name: "MOS Temperature"
      id: mos_temp
    temperature_sensor_1:
      name: "Battery Temp 1"
      id: temp_1
    min_cell_voltage:
      name: "Min Cell Voltage"
      id: min_cell_voltage
    max_cell_voltage:
      name: "Max Cell Voltage"
      id: max_cell_voltage
    cell_voltage_1:
      name: "Cell 01 Voltage"
    cell_voltage_2:
      name: "Cell 02 Voltage"
    cell_voltage_3:
      name: "Cell 03 Voltage"
    cell_voltage_4:
      name: "Cell 04 Voltage"
    cell_voltage_5:
      name: "Cell 05 Voltage"
    cell_voltage_6:
      name: "Cell 06 Voltage"
    cell_voltage_7:
      name: "Cell 07 Voltage"
    cell_voltage_8:
      name: "Cell 08 Voltage"

interval:
  # 1. Giao tiếp CAN với biến tần Senergy 4kW (chuẩn PYLON) mỗi 1 giây
  - interval: 1s
    then:
      - lambda: |-
          if (isnan(id(total_voltage).state) || isnan(id(state_of_charge).state)) return;

          // Khung 0x351: Gioi han sac/xa (28.4V, Sac 70A, Xa 75A, Ngat xa 25.0V)
          uint16_t charge_v = 284;
          int16_t charge_c = 700;
          int16_t discharge_c = 750;
          uint16_t discharge_v = 250;
          std::vector<uint8_t> d351 = {
            (uint8_t)(charge_v & 0xFF), (uint8_t)(charge_v >> 8),
            (uint8_t)(charge_c & 0xFF), (uint8_t)(charge_c >> 8),
            (uint8_t)(discharge_c & 0xFF), (uint8_t)(discharge_c >> 8),
            (uint8_t)(discharge_v & 0xFF), (uint8_t)(discharge_v >> 8)
          };
          id(can_bus).send_data(0x351, false, d351);

          // Khung 0x355: Phan tram pin SoC & SoH
          uint16_t soc = (uint16_t)id(state_of_charge).state;
          uint16_t soh = 100;
          std::vector<uint8_t> d355 = {
            (uint8_t)(soc & 0xFF), (uint8_t)(soc >> 8),
            (uint8_t)(soh & 0xFF), (uint8_t)(soh >> 8),
            0x00, 0x00, 0x00, 0x00
          };
          id(can_bus).send_data(0x355, false, d355);

          // Khung 0x356: Dien ap, Dong dien, Nhiet do
          int16_t volt = (int16_t)(id(total_voltage).state * 100);
          int16_t curr = isnan(id(current).state) ? 0 : (int16_t)(id(current).state * 10);
          int16_t temp = isnan(id(temp_1).state) ? 250 : (int16_t)(id(temp_1).state * 10);
          std::vector<uint8_t> d356 = {
            (uint8_t)(volt & 0xFF), (uint8_t)(volt >> 8),
            (uint8_t)(curr & 0xFF), (uint8_t)(curr >> 8),
            (uint8_t)(temp & 0xFF), (uint8_t)(temp >> 8),
            0x00, 0x00
          };
          id(can_bus).send_data(0x356, false, d356);

          // Khung 0x359 & 0x35C: Co bao ve & Cho phep sac/xa
          std::vector<uint8_t> d359 = {0x00, 0x00, 0x00, 0x00, 0x01, 0x50, 0x4E, 0x00};
          id(can_bus).send_data(0x359, false, d359);

          std::vector<uint8_t> d35c = {0xC0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00};
          id(can_bus).send_data(0x35C, false, d35c);

          // Khung 0x35E: Ten hang PYLON
          std::vector<uint8_t> d35e = {'P', 'Y', 'L', 'O', 'N', ' ', ' ', ' '};
          id(can_bus).send_data(0x35E, false, d35e);

  # 2. Gửi dữ liệu lên Blynk Cloud mỗi 5 giây để xem qua 4G
  - interval: 5s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                url: !lambda |-
                  if (isnan(id(total_voltage).state)) return std::string("");
                  char url[300];
                  snprintf(url, sizeof(url),
                    "https://blynk.cloud{blynk_token}&V0=%.2f&V1=%.2f&V2=%.0f&V3=%.1f&V4=%.1f&V5=%.3f&V6=%.3f",
                    id(total_voltage).state,
                    isnan(id(current).state) ? 0.0 : id(current).state,
                    isnan(id(state_of_charge).state) ? 0.0 : id(state_of_charge).state,
                    isnan(id(mos_temp).state) ? 0.0 : id(mos_temp).state,
                    isnan(id(temp_1).state) ? 0.0 : id(temp_1).state,
                    isnan(id(min_cell_voltage).state) ? 0.0 : id(min_cell_voltage).state,
                    isnan(id(max_cell_voltage).state) ? 0.0 : id(max_cell_voltage).state
                  );
                  return std::string(url);
